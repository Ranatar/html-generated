<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кузница Феанора: Создание Сильмариллов</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Crimson Text', serif;
      background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .game-container {
      max-width: 900px;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #444;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
    }
    
    h1 {
      font-family: 'Cinzel', serif;
      text-align: center;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-bottom: 30px;
      font-size: 2.5em;
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .stats-block {
      background: rgba(20, 20, 40, 0.6);
      border: 1px solid #444;
      border-radius: 10px;
      padding: 15px;
    }
    
    .stats-block h3 {
      font-family: 'Cinzel', serif;
      color: #87ceeb;
      margin-bottom: 10px;
      font-size: 1.2em;
    }
    
    .stat-line {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 1.1em;
    }
    
    .stat-value {
      color: #ffd700;
      font-weight: bold;
    }
    
    .game-text {
      background: rgba(10, 10, 20, 0.6);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 25px;
      min-height: 200px;
      line-height: 1.8;
      font-size: 1.15em;
    }
    
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .choice-btn {
      background: linear-gradient(135deg, #1a237e, #283593);
      border: 2px solid #3949ab;
      color: #e8e8e8;
      padding: 15px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.05em;
      font-family: 'Crimson Text', serif;
      transition: all 0.3s ease;
      text-align: left;
    }
    
    .choice-btn:hover {
      background: linear-gradient(135deg, #283593, #3949ab);
      border-color: #5c6bc0;
      box-shadow: 0 0 15px rgba(92, 107, 192, 0.4);
      transform: translateX(5px);
    }
    
    .materials-display {
      background: rgba(40, 20, 0, 0.4);
      border: 1px solid #8b4513;
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      font-style: italic;
      color: #daa520;
    }
    
    .event-warning {
      color: #ff6b6b;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      font-size: 1.1em;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .location-line {
      margin: 16px 0;
      padding: 12px 16px;
      border-left: 3px solid #6b7a8f;
      background: rgba(30, 35, 50, 0.4);
      border-radius: 4px;
      color: #9fb0c8;
      font-style: italic;
      line-height: 1.7;
    }

    .achievement-flash {
      margin: 18px 0;
      padding: 14px 18px;
      text-align: center;
      font-weight: bold;
      color: #ffd700;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.14), rgba(135, 206, 235, 0.10));
      border: 2px solid rgba(255, 215, 0, 0.6);
      border-radius: 10px;
      line-height: 1.7;
    }

    .special-event {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(135, 206, 235, 0.1));
      border: 1px solid #ffd700;
      border-radius: 8px;
      padding: 10px;
      margin-top: 15px;
      animation: shimmer 3s infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
      50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
    }
    
    .ending-text {
      font-size: 1.2em;
      line-height: 1.8;
      text-align: center;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
    
    .restart-btn {
      display: block;
      margin: 30px auto 0;
      background: linear-gradient(135deg, #ff6b00, #ff8800);
      border: 2px solid #ffa500;
      color: white;
      padding: 15px 40px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2em;
      font-family: 'Cinzel', serif;
      transition: all 0.3s ease;
    }
    
    .restart-btn:hover {
      background: linear-gradient(135deg, #ff8800, #ffaa00);
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
    }
    
    @keyframes glow {
      0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
      50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
      100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
    }
    
    .silmaril-complete {
      animation: glow 2s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reaction-text {
      background: linear-gradient(135deg, rgba(75, 0, 130, 0.2), rgba(138, 43, 226, 0.1));
      border-left: 4px solid #9370db;
      padding: 20px;
      margin: 15px 0;
      font-style: italic;
      font-size: 1.1em;
      line-height: 1.6;
      color: #e8d4ff;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(147, 112, 219, 0.3);
    }
    
    .choice-result {
      animation: slideInFromRight 0.5s ease-out;
    }
    
    @keyframes slideInFromRight {
      from {
        transform: translateX(20px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .event-normal {
      color: #daa520;
      font-style: italic;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: rgba(218, 165, 32, 0.1);
      border-left: 3px solid #daa520;
      border-radius: 5px;
      animation: fadeIn 1s;
    }

    .event-magical {
      color: #87ceeb;
      font-style: italic;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: linear-gradient(135deg, rgba(135, 206, 235, 0.1), rgba(255, 215, 0, 0.1));
      border: 1px solid #87ceeb;
      border-radius: 5px;
      animation: shimmer 3s infinite, fadeIn 1s;
    }

    .event-dark {
      color: #ff6b6b;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: rgba(139, 0, 0, 0.2);
      border-left: 3px solid #8b0000;
      border-radius: 5px;
      animation: pulse 2s infinite, fadeIn 1s;
    }

    .event-comic {
      color: #98fb98;
      font-style: italic;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: rgba(152, 251, 152, 0.1);
      border: 2px dashed #98fb98;
      border-radius: 5px;
      animation: bounce-in 0.5s;
    }

    @keyframes bounce-in {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      50% {
        transform: scale(1.05);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes shimmer {
      0%, 100% { 
        box-shadow: 0 0 10px rgba(135, 206, 235, 0.3); 
      }
      50% { 
        box-shadow: 0 0 20px rgba(135, 206, 235, 0.6); 
      }
    }


    /* Отображение текущей фазы света */
    .tree-phase-display {
      background: linear-gradient(135deg, rgba(40, 40, 60, 0.8), rgba(60, 60, 80, 0.8));
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-style: italic;
      color: #e8e8e8;
      animation: fadeIn 1s;
    }

    /* Стили для событий в разных фазах света */
    .event-golden {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 193, 7, 0.1));
      border-left: 3px solid #ffd700;
      color: #ffecb3;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      animation: golden-glow 3s infinite;
    }

    .event-silver {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(211, 211, 211, 0.1));
      border-left: 3px solid #c0c0c0;
      color: #e8e8e8;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      animation: silver-shimmer 3s infinite;
    }

    .event-mingling {
      background: linear-gradient(135deg, 
        rgba(255, 215, 0, 0.15), 
        rgba(192, 192, 192, 0.15), 
        rgba(255, 215, 0, 0.15));
      border: 1px solid;
      border-image: linear-gradient(135deg, #ffd700, #c0c0c0) 1;
      color: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      animation: phase-shift 4s infinite;
    }

    .event-anomaly {
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 0, 0, 0.1),
        rgba(255, 0, 0, 0.1) 10px,
        rgba(0, 0, 0, 0.1) 10px,
        rgba(0, 0, 0, 0.1) 20px
      );
      border: 2px solid #ff0000;
      color: #ff6b6b;
      padding: 12px;
      margin: 15px 0;
      border-radius: 5px;
      font-weight: bold;
      animation: anomaly-pulse 1s infinite;
    }

    .event-darkness {
      background: #000;
      border: 1px solid #333;
      color: #666;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      text-shadow: 0 0 5px #666;
      animation: darkness-flicker 2s infinite;
    }

    .event-blinding {
      background: radial-gradient(circle, 
        rgba(255, 255, 255, 0.9), 
        rgba(255, 255, 255, 0.5));
      border: 2px solid #fff;
      color: #000;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
      animation: blinding-pulse 0.5s infinite;
    }

    .anomaly-warning {
      background: rgba(139, 0, 0, 0.3);
      border: 2px dashed #ff0000;
      color: #ff6b6b;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      animation: shake 0.5s;
    }

    /* Анимации */
    @keyframes golden-glow {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
      50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
    }

    @keyframes silver-shimmer {
      0%, 100% { box-shadow: 0 0 10px rgba(192, 192, 192, 0.3); }
      50% { box-shadow: 0 0 20px rgba(192, 192, 192, 0.6); }
    }

    @keyframes phase-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes anomaly-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes darkness-flicker {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    @keyframes blinding-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Кузница Феанора</h1>
    
    <div class="stats-container">
      <div class="stats-block">
        <h3>Феанор</h3>
        <div class="stat-line">
          <span>Мудрость:</span>
          <span class="stat-value" id="wisdom">50</span>
        </div>
        <div class="stat-line">
          <span>Мастерство:</span>
          <span class="stat-value" id="skill">70</span>
        </div>
        <div class="stat-line">
          <span>Гордость:</span>
          <span class="stat-value" id="pride">60</span>
        </div>
      </div>
      
      <div class="stats-block">
        <h3>Сильмариллы</h3>
        <div class="stat-line">
          <span>Свет:</span>
          <span class="stat-value" id="light">0</span>
        </div>
        <div class="stat-line">
          <span>Чистота:</span>
          <span class="stat-value" id="purity">0</span>
        </div>
        <div class="stat-line">
          <span>Сила:</span>
          <span class="stat-value" id="power">0</span>
        </div>
      </div>
    </div>
    
    <div class="game-text" id="gameText">
      Загрузка...
    </div>
    
    <div class="choices-container" id="choices">
    </div>
  </div>
  
  <script>
    const gameState = {
      stage: 0,
      feanor: {
        wisdom: 50,
        skill: 70,
        pride: 60
      },
      silmarils: {
        light: 0,
        purity: 0,
        power: 0
      },
      materials: [],
      choices: {
        helpFromValar: null,
        melkorRelation: null,
        familySupport: null,
        method: null
      },
      events: [],
      galadriel: { trust: 0, asks: 0, gave_blessing: false, forgave: false },
      miniEventsLog: [],

      treePhase: 'laurelin', // Начинаем с золотого света
      phaseCount: 0, // Счётчик смены фаз
      anomalyActive: false // Флаг аномалии в цикле
    };

    const reactionTexts = {
      immediate: {}, // Немедленные реакции на выборы
      transition: {} // Тексты перехода между стадиями
    };
    
    function getNextTreePhase(currentPhase) {
      const normalCycle = {
        'laurelin': 'mingling-golden', // Лаурелин → смешение (от золотого)
        'mingling-golden': 'telperion', // Смешение → Телперион
        'telperion': 'mingling-silver', // Телперион → смешение (от серебряного)
        'mingling-silver': 'laurelin' // Смешение → Лаурелин
      };
      
      // Шанс на аномалию в цикле (5%)
      if (Math.random() < 0.05 && !gameState.anomalyActive) {
        gameState.anomalyActive = true;
        const anomalies = [
          'double-light', // Оба Древа светят одновременно
          'darkness', // Внезапная тьма
          'frozen-light', // Свет застыл
          'reverse-cycle', // Обратный порядок
          'eternal-mingling' // Затянувшееся смешение
        ];
        return anomalies[Math.floor(Math.random() * anomalies.length)];
      }
      
      // Сброс аномалии после одного цикла
      if (gameState.anomalyActive) {
        gameState.anomalyActive = false;
      }
      
      return normalCycle[currentPhase] || 'laurelin';
    }

    function advanceTreePhase() {
      const previousPhase = gameState.treePhase;
      gameState.treePhase = getNextTreePhase(gameState.treePhase);
      gameState.phaseCount++;
      
      // Применение эффектов фазы на работу
      applyPhaseEffects(gameState.treePhase);
      
      return { previous: previousPhase, current: gameState.treePhase };
    }

    function applyPhaseEffects(phase) {
      switch(phase) {
        case 'laurelin':
          // Золотой свет улучшает силу и мастерство
          if (Math.random() > 0.7) {
            gameState.feanor.skill += 1;
            gameState.silmarils.power += 1;
          }
          break;
          
        case 'telperion':
          // Серебряный свет улучшает мудрость и чистоту
          if (Math.random() > 0.7) {
            gameState.feanor.wisdom += 1;
            gameState.silmarils.purity += 1;
          }
          break;
          
        case 'mingling-golden':
        case 'mingling-silver':
          // Смешение света балансирует характеристики
          if (Math.random() > 0.8) {
            gameState.silmarils.light += 2;
          }
          break;
          
        case 'double-light':
          // Аномалия! Огромный бонус, но риск
          if (Math.random() > 0.5) {
            gameState.silmarils.light += 6;
            gameState.silmarils.power += 7;
          } else {
            // Перегрузка!
            gameState.silmarils.purity -= 2;
          }
          gameState.events.push('double_light_anomaly');
          break;
          
        case 'darkness':
          // Тьма! Негативные эффекты, но концентрация
          gameState.silmarils.light -= 3;
          gameState.feanor.wisdom += 1; // Тьма учит ценить свет
          gameState.events.push('darkness_anomaly');
          break;
          
        case 'frozen-light':
          // Застывший свет - идеален для кристаллизации!
          gameState.silmarils.purity += 4;
          gameState.events.push('frozen_light_anomaly');
          break;
      }
    }

    function getTreePhaseDescription() {
      const descriptions = {
        'laurelin': "🌅 Золотой свет Лаурелин заливает Валинор тёплым сиянием",
        'telperion': "🌙 Серебряный свет Телпериона омывает мир холодным сиянием",
        'mingling-golden': "🌄 Свет Древ смешивается, золото уступает место серебру",
        'mingling-silver': "🌆 Свет Древ сплетается, серебро сменяется золотом",
        'double-light': "⚡ АНОМАЛИЯ! Оба Древа сияют одновременно! Невозможная яркость!",
        'darkness': "🌑 АНОМАЛИЯ! Древа погасли! Валинор погружён во тьму!",
        'frozen-light': "❄️ АНОМАЛИЯ! Свет застыл в воздухе как хрусталь!",
        'reverse-cycle': "🔄 АНОМАЛИЯ! Цикл идёт в обратную сторону!",
        'eternal-mingling': "∞ АНОМАЛИЯ! Смешение света не прекращается уже долгое время!"
      };
      
      return descriptions[gameState.treePhase] || descriptions['laurelin'];
    }

    // Новая функция для показа реакции перед переходом
    function showReactionAndProceed(reactionText, nextStageId) {
      const textDiv = document.getElementById('gameText');
      const choicesDiv = document.getElementById('choices');
      
      // Показываем реакцию
      textDiv.innerHTML = `<div class="reaction-text" style="animation: fadeIn 0.5s">${reactionText}</div>`;
      
      
      // Кнопка строится в DOM, а не строкой: подстановка id в атрибут
      // onclick ломается в обе стороны — без кавычек renderStage(0a)
      // это SyntaxError, а с кавычками id перестаёт быть числом,
      // и расписание эха (stages: [4,6,8]) перестаёт совпадать.
      choicesDiv.innerHTML = '';
      const goBtn = document.createElement('button');
      goBtn.className = 'choice-btn';
      goBtn.style.background = 'linear-gradient(135deg, #2a3f5f, #3d5a80)';
      goBtn.style.borderColor = '#5c7cfa';
      goBtn.style.textAlign = 'center';
      goBtn.style.fontStyle = 'italic';
      goBtn.textContent = 'Продолжить →';
      goBtn.onclick = function () { renderStage(nextStageId); };
      choicesDiv.appendChild(goBtn);
      
    }

    
    const stages = [
      {
        id: 0,
        text: "Ты - Феанор, сын Финвэ, величайший из Нолдор. В твоих жилах течёт огонь духа, унаследованный от Мириэли, которая отдала всю свою силу, родив тебя. Годы учения у Аулэ принесли плоды - твоё мастерство превосходит даже мастерство Махтана. Ты создал палантиры, тенгвар, бесчисленные чудеса... но сердце жаждет большего.\n\nВ садах Лориэн, под сенью Древ, тебе является видение: три кристалла, вмещающие несотворённый свет Лаурелин и Телпериона. Но путь к такому творению потребует не только мастерства...",
        choices: [
          {
            text: "Обратиться к Валар за благословением и советом",
            reaction: "Ты приходишь в Маханаксар, круг судеб, где восседают Валар. Манвэ Сулимо смотрит на тебя проницательным взглядом: 'Я видел твоё видение в ветрах, Феанаро. Это путь славы... и опасности.' Варда Элентари спускается со звёздного трона: 'Если твой дух чист, я благословлю твой труд светом Элберет.' Её прикосновение наполняет тебя звёздным сиянием.",
            effect: () => {
              gameState.feanor.wisdom += 2;
              gameState.feanor.pride -= 5;
              gameState.choices.helpFromValar = true;
              gameState.silmarils.purity += 6;
              gameState.events.push('valar_audience');
            },
            next: "0a" // Новая промежуточная сцена
          },

        this.frequency = config.frequency || 'common'; // common, uncommon, rare
        this.stageRange = config.stageRange || [1, 9]; // На каких стадиях может появиться
      }
    }

    // Функция выбора подходящего мини-события
    function selectMiniEvent(currentStage) {
      const candidates = MINI_EVENTS_POOL.filter(event => {
        // Проверка стадии
        if (currentStage < event.stageRange[0] || currentStage > event.stageRange[1]) {
          return false;
        }
        
        // Проверка условий триггера
        if (!event.triggerConditions()) {
          return false;
        }
        
        // Проверка, не было ли уже
        if (gameState.triggeredMiniEvents && gameState.triggeredMiniEvents.includes(event.id)) {
          return false;
        }
        
        return true;
      });
      
      if (candidates.length === 0) return null;
      
      // Взвешенный случайный выбор по частоте
      const weights = {
        'common': 5,
        'uncommon': 3,
        'rare': 1
      };
      
      const weightedCandidates = [];
      candidates.forEach(event => {
        const weight = weights[event.frequency];
        for (let i = 0; i < weight; i++) {
          weightedCandidates.push(event);
        }
      });
      
      return weightedCandidates[Math.floor(Math.random() * weightedCandidates.length)];
    }

    // ============================================
    // РЕГИСТРАЦИЯ ЭХА ПО СОБЫТИЯМ
    //
    // ECHO_EFFECTS объявляет девять типов эха со своим расписанием
    // возврата, но регистрировались только четыре, и только внутри
    // мини-событий. Пять типов — helped_valar, rejected_valar,
    // used_rare_material, showed_humility, committed_violence —
    // были написаны целиком и не срабатывали никогда.
    //
    // Расставлять registerChoiceEcho вручную по трёмстам выборам
    // бессмысленно. Здесь эхо привязано к СОБЫТИЯМ, которые выборы
    // и так выставляют: после каждого хода смотрим, что появилось
    // нового, и заводим соответствующее эхо.
    // ============================================

    const ECHO_TRIGGERS = {

    // Редкие материалы — те, что достаются не всякому.
    const RARE_MATERIALS = [
      'primordial_void', 'purified_void', 'void_crystal', 'void_crystal_embedded',
      'adamant_heart', 'adamant_blessed', 'adamant_unity',
      'nienna_tear', 'nienna_tears_healing', 'telperion_gift',

    function syncEchoes() {
      if (!gameState.echoSeen) gameState.echoSeen = [];

      for (const type in ECHO_TRIGGERS) {
        for (const ev of ECHO_TRIGGERS[type]) {
          if (gameState.events.includes(ev) && !gameState.echoSeen.includes(ev)) {
            gameState.echoSeen.push(ev);
            registerChoiceEcho(type, ev);
          }
        }
      }

      for (const m of gameState.materials) {
        const key = 'material:' + m;
        if (RARE_MATERIALS.includes(m) && !gameState.echoSeen.includes(key)) {
          gameState.echoSeen.push(key);
          registerChoiceEcho('used_rare_material', m);
        }
      }
    }

    // ============================================
    // ГРУППА Б: оживление того, чему не хватало содержания
    //
    // shouldShowOption, isPathAvailable, hasConflictingEvents и
    // getEventModifiers были написаны и не вызывались — но не потому,
    // что сломаны, а потому, что им не с чем работать: у выборов не
    // было идентификаторов, у событий реестра не было поля conditions,
    // а путь к концовке никто не спрашивал о доступности.
    // Здесь дано недостающее.
    // ============================================

    // ── Наборы взаимоисключающих событий ──────────────────────────
    // hasConflictingEvents(...ids) отвечает «случилось ли ВСЁ
    // перечисленное». Набор, где всё сразу — это противоречие пути:
    // игрок и доверился, и отверг; и дал клятву, и отступил.
    const CONFLICT_SETS = [
      { ids: ['used_melkor_gift', 'rejected_melkor_gift'],
        note: "Ты и слушал его, и гнал его. Обе памяти живут в тебе." },
      { ids: ['family_infusion', 'family_alienated'],
        note: "Семья вложена в камни — и отдалена от тебя. Одно не отменило другого." },
      { ids: ['drawn_sword', 'brothers_united'],
        note: "Меч был обнажён, и братья всё же сошлись. Шов виден до сих пор." },
      { ids: ['showed_mercy', 'possessive_obsession'],
        note: "Ты умел отпускать и не смог отпустить. Оба раза — ты." },
      { ids: ['humble_creation', 'path_of_pride'],
        note: "Смирение и гордость шли одной дорогой и ни разу не встретились." }
    ];

    function activeConflicts() {
      return CONFLICT_SETS.filter(c => hasConflictingEvents(...c.ids));
    }

    // ── Доступность выбора ───────────────────────────────────────
    // Возвращает { ok, bonus }. shouldShowOption умеет отвечать и
    // булевым, и объектом { available, bonus } — учитываем оба.
    function optionAllowed(choice, stageId) {
      if (!choice.optionId) return { ok: true, bonus: 0 };
      const verdict = shouldShowOption(choice.optionId, stageId);
      if (typeof verdict === 'object' && verdict !== null) {
        return { ok: verdict.available !== false, bonus: verdict.bonus || 0 };
      }
      return { ok: !!verdict, bonus: 0 };
    }

    // ── Склонности, накопленные событиями ────────────────────────
    // getEventModifiers суммирует поле conditions у событий реестра.
    // Числа НЕ прибавляются к характеристикам: балансировка на них
    // не рассчитана. Они показывают, куда путь тянул на самом деле,
    // и один раз влияют на дело — см. applyDeedTaint.
    function deedTendencies() {
      const m = getEventModifiers();
      const named = [
        ['мудрость',  m.wisdom],
        ['гордость',  m.pride],
        ['чистота',   m.silmarilPurity]
      ].filter(x => x[1] !== 0);
      return { raw: m, named };
    }

    // Единственное действие склонностей: если дела запятнали работу
    // сильнее некоторого предела, это становится событием, и его
    // видят проверки тёмных концовок.
    // Пороги подобраны по замеру, а не на глаз: реестр перекошен
    // в плюс (113 событий с положительным весом против 27), и
    // склонность чистоты за партию идёт 0…74 с медианой 33.
    // Симметричные пороги ±20 давали «освящён» в трёх партиях из
    // четырёх и «запятнан» — ни в одной.
    function applyDeedTaint() {
      // Судить о пути можно только когда он пройден: на первом
      // экране склонность равна нулю, и нижний порог срабатывал
      // сразу у всех.
      if (gameState.events.length < 14) return;

      const m = getEventModifiers();
      if (m.silmarilPurity <= 8 && !gameState.events.includes('tainted_by_deeds')) {
        gameState.events.push('tainted_by_deeds');
      }
      if (m.silmarilPurity >= 55 && !gameState.events.includes('hallowed_by_deeds')) {
        gameState.events.push('hallowed_by_deeds');
      }
    }

    function applyEchoEffects(currentStage) {
      if (!gameState.echos || gameState.echos.length === 0) return;
      
      const appliedEchoes = [];
      const firedThisTurn = [];
      
      gameState.echos.forEach(echo => {
        const echoConfig = ECHO_EFFECTS[echo.type];
        if (!echoConfig) return;
        
        // Стадия сравнивается как строка: id в игре смешанные,
        // а в расписании эха записаны числами.
        if (!echoConfig.stages.some(st => String(st) === String(currentStage))) return;
        
        // Один тип — один раз за ход. Кумулятивные и так учитывают
        // число повторений множителем внутри себя.
        if (firedThisTurn.includes(echo.type)) return;
        firedThisTurn.push(echo.type);
        
        // Проверяем кумулятивность
        if (echoConfig.cumulative) {
          const sameTypeEchoes = gameState.echos.filter(e => e.type === echo.type);
          // Усиливаем эффект в зависимости от количества повторений
          const multiplier = Math.min(sameTypeEchoes.length, 3);
          
          if (echoConfig.effects[currentStage]) {
            const message = echoConfig.effects[currentStage](multiplier);
            if (message) appliedEchoes.push(message);
          }
        } else {
          if (echoConfig.effects[currentStage]) {
            const message = echoConfig.effects[currentStage]();
            if (message) appliedEchoes.push(message);
          }
        }
      });
      
      // Показываем все активированные эхо
      if (appliedEchoes.length > 0) {
        displayEchoNotifications(appliedEchoes);
      }
    }

    function displayEchoNotifications(echoes) {
      const notificationHtml = `
        <div class="echo-notifications" style="
          position: fixed;
          top: 100px;
          right: 20px;
          max-width: 300px;
          z-index: 1000;
          animation: slideInFromRight 0.5s;
        ">
          ${echoes.map(echo => `
            <div class="echo-notification" style="
              background: linear-gradient(135deg, rgba(138, 43, 226, 0.9), rgba(75, 0, 130, 0.9));
              padding: 15px;
              margin-bottom: 10px;
              border-radius: 8px;
              border-left: 4px solid #9370db;
              color: white;
              box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
              animation: fadeInOut 5s forwards;
            ">
              <strong style="color: #daa520;">🔮 ${echo}</strong>
            </div>
          `).join('')}
        </div>
      `;
      
      // Добавляем в DOM
      document.body.insertAdjacentHTML('beforeend', notificationHtml);
      
      // Удаляем после анимации
      setTimeout(() => {
        const notifications = document.querySelector('.echo-notifications');
        if (notifications) notifications.remove();
      }, 5000);
    }

    // Обновлённая регистрация эха с правильными типами
    function registerChoiceEcho(choiceType, context) {
      if (!gameState.echos) {
        gameState.echos = [];
      }
      
      gameState.echos.push({
        type: choiceType,
        stage: gameState.stage,
        context: context,
        timestamp: Date.now()
      });
      
      // Дебаг
      console.log(`Эхо зарегистрировано: ${choiceType} на стадии ${gameState.stage}`);
    }

    // ============================================
    // ФУНКЦИИ ДЛЯ АНАЛИЗА СОБЫТИЙ
    // ============================================

    function getEventWeight(eventId) {
      return EVENT_REGISTRY[eventId]?.weight || 0;
    }

    function getEventsScore() {
      let score = 0;
      gameState.events.forEach(eventId => {
        score += getEventWeight(eventId);
      });
      return score;
    }

    function getEventsByCategory(category) {
      return gameState.events.filter(eventId => 
        EVENT_REGISTRY[eventId]?.category === category
      );
    }

    function hasConflictingEvents(...eventIds) {
      return eventIds.every(id => gameState.events.includes(id));
    }

    // Определение "пути" игрока на основе событий
    function determinePath() {
      const familyEvents = getEventsByCategory('family');
      const politicalEvents = getEventsByCategory('political');
      const melkorEvents = getEventsByCategory('melkor');
      const mysticalEvents = getEventsByCategory('mystical');
      const sacrificeEvents = getEventsByCategory('sacrifice');
      
      const paths = {
        family: familyEvents.length,
        political: politicalEvents.length,
        melkor: melkorEvents.length,
        mystical: mysticalEvents.length,
        sacrifice: sacrificeEvents.length
      };
      
      // Находим доминирующий путь
      const dominantPath = Object.keys(paths).reduce((a, b) => 
        paths[a] > paths[b] ? a : b
      );
      
      // Определяем подкатегории
      const pathDetails = {
        ...paths,
        mainPath: dominantPath,
        score: getEventsScore(),
        balance: Math.abs(gameState.feanor.wisdom - gameState.feanor.pride),
        familySupport: gameState.choices.familySupport,
        melkorRelation: gameState.choices.melkorRelation
      };
      
      return pathDetails;
    }

    // ФУНКЦИЯ ГЕНЕРАЦИИ СТАТИСТИКИ ДЛЯ КОНЦОВКИ
    // ============================================

    function generateEndingStats() {
      const path = determinePath();
      
      return {
        finalStats: {
          wisdom: gameState.feanor.wisdom,
          skill: gameState.feanor.skill,
          pride: gameState.feanor.pride,
          silmarilLight: gameState.silmarils.light,
          silmarilPurity: gameState.silmarils.purity,
          silmarilPower: gameState.silmarils.power
        },
        journey: {
          eventsTriggered: gameState.events.length,
          materialsGathered: gameState.materials.length,
          miniEventsExperienced: gameState.triggeredMiniEvents?.length || 0,
          echosGenerated: gameState.echos?.length || 0,
          phaseCycles: gameState.phaseCount
        },
        path: {
          dominant: path.mainPath,
          score: path.score,
          familyEvents: getEventsByCategory('family').length,
          politicalEvents: getEventsByCategory('political').length,
          mysticalEvents: getEventsByCategory('mystical').length,
          melkorEvents: getEventsByCategory('melkor').length,
          sacrificeEvents: getEventsByCategory('sacrifice').length
        },
        relationships: {
          family: gameState.choices.familySupport,
          melkor: gameState.choices.melkorRelation,
          valar: gameState.choices.helpFromValar
        },
        keyMoments: gameState.events.filter(e => 
          EVENT_REGISTRY[e]?.weight >= 15 || EVENT_REGISTRY[e]?.weight <= -15
        )
      };

    // ============================================
    // ИСПОЛЬЗОВАНИЕ СОБЫТИЙ В УСЛОВИЯХ СТАДИЙ
    // ============================================

    // Добавить в существующие проверки условий:

    function shouldShowOption(optionId, currentStage) {
      // Примеры использования событий в условиях
      
      switch(optionId) {
        case 'call_family_help':
          // Эта опция доступна только если не было отчуждения
          return !gameState.events.includes('family_alienated') &&
               !gameState.events.includes('family_postponed');
        
        case 'trust_melkor_again':
          // Можно доверить снова только если были хорошие отношения
          return gameState.events.includes('traded_with_melkor') ||
               gameState.events.includes('melkor_confidant');
        
        case 'seek_aule_help':
          // Аулэ охотнее помогает если было сотрудничество
          if (gameState.events.includes('aule_collaboration')) {
            // Даём бонус к эффекту
            return { available: true, bonus: 10 };
          }
          return { available: true, bonus: 0 };
        
        case 'use_mandos_prophecy':
          // Можно использовать пророчество только если оно было
          return gameState.events.includes('mandos_prophecy');
        
        case 'brothers_united_option':
          // Объединение возможно если не было серьёзного конфликта
          return !gameState.events.includes('drawn_sword') &&
               !gameState.events.includes('brothers_divided');
        
        case 'sacrifice_option':
          // Жертва возможна только при достаточной мудрости
          return gameState.feanor.wisdom >= 60 &&
               !gameState.events.includes('possessive_obsession');
        
        default:
          return true;
      }
    }

    // Функция проверки доступности пути
    function isPathAvailable(pathName) {
      const blocks = {
        'redemption': ['noldor_split', 'drawn_sword'],
        'family': ['family_alienated'],
        'political': ['brothers_divided', 'noldor_split'],
        'sacrifice': ['possessive_obsession', 'hidden_away']
      };
      
      if (blocks[pathName]) {
        return !blocks[pathName].some(event => 
          gameState.events.includes(event)
        );
      }
      
      return true;
    }

    // ============================================
    // ДИНАМИЧЕСКИЕ МОДИФИКАТОРЫ НА ОСНОВЕ СОБЫТИЙ
    // ============================================

    // Система бонусов/штрафов от накопленных событий
    function getEventModifiers() {
      const modifiers = {
        wisdom: 0,
        skill: 0,
        pride: 0,
        silmarilLight: 0,
        silmarilPurity: 0,
        silmarilPower: 0
      };
      
      gameState.events.forEach(eventId => {
        const eventData = EVENT_REGISTRY[eventId];
        if (eventData?.conditions) {
          if (eventData.conditions.improves_wisdom) {
            modifiers.wisdom += eventData.conditions.improves_wisdom;
          }
          if (eventData.conditions.reduces_wisdom) {
            modifiers.wisdom -= eventData.conditions.reduces_wisdom;
          }
          if (eventData.conditions.increases_pride) {
            modifiers.pride += eventData.conditions.increases_pride;
          }
          if (eventData.conditions.reduces_pride) {
            modifiers.pride -= eventData.conditions.reduces_pride;
          }
          if (eventData.conditions.improves_silmaril_purity) {
            modifiers.silmarilPurity += eventData.conditions.improves_silmaril_purity;
          }
          if (eventData.conditions.reduces_silmaril_purity) {
            modifiers.silmarilPurity -= eventData.conditions.reduces_silmaril_purity;
          }
        }
      });
      
      return modifiers;
    }

    // ============================================
    // ИСПОЛЬЗОВАНИЕ СОБЫТИЙ В МОДИФИКАЦИИ ВЫБОРОВ
    // ============================================

    function modifyChoiceByEvents(choice, stageId) {
      const e = gameState.events;
      const modifiedChoice = {...choice};
      
      // Пример: если было сотрудничество с Аулэ, выборы с его участием эффективнее
      if (e.includes('aule_collaboration')) {
        if (choice.text.includes('Аулэ') || choice.text.includes('учитель')) {
          const originalEffect = choice.effect;
          modifiedChoice.effect = () => {
            originalEffect();
            gameState.feanor.skill += 1; // Бонус от прошлого сотрудничества
            gameState.silmarils.power += 2;
          };
          modifiedChoice.reaction += "\n\n💫 Аулэ помнит ваше прошлое сотрудничество и помогает особенно охотно!";
        }
      }
      
      // Если было благословение Йаванны, природные материалы эффективнее
      if (e.includes('yavanna_blessing')) {
        if (choice.text.includes('цветок') || choice.text.includes('древ') || choice.text.includes('лист')) {
          const originalEffect = choice.effect;
          modifiedChoice.effect = () => {
            originalEffect();
            gameState.silmarils.purity += 2; // Бонус от благословения
          };
          modifiedChoice.reaction += "\n\n🌿 Благословение Йаванны усиливает природный компонент!";
        }
      }
      
      // Если было предательство Мелькора, недоверие к тёмным предложениям
      if (e.includes('betrayed_by_melkor')) {
        if (choice.text.toLowerCase().includes('мелькор') && !choice.text.includes('против')) {
          modifiedChoice.reaction = "⚠️ Осторожность! Ты помнишь прошлое предательство...\n\n" + modifiedChoice.reaction;
        }
      }
      
      // Если была семейная поддержка, семейные варианты эффективнее
      if (e.includes('family_infusion') || e.includes('family_reconciliation')) {
        if (choice.text.includes('семь') || choice.text.includes('сынов') || choice.text.includes('Нерданель')) {
          const originalEffect = choice.effect;
          modifiedChoice.effect = () => {
            originalEffect();
            gameState.silmarils.purity += 3; // Любовь усиливает чистоту
          };
          modifiedChoice.reaction += "\n\n❤️ Узы любви укрепляют творение!";
        }
      }
      
      // Если получено пророчество Мандоса, мудрые выборы очевиднее
      if (e.includes('mandos_prophecy')) {
        // Добавляем подсказки к мудрым выборам
        if (choice.effect.toString().includes('wisdom +=')) {
          modifiedChoice.text = "✨ " + modifiedChoice.text + " [Пророчество подсказывает]";
        }
      }
      
      // Если были конфликты с братьями, примирительные жесты важнее
      if (e.includes('brothers_divided') || e.includes('drawn_sword')) {
        if (choice.text.includes('прим') || choice.text.includes('извин') || choice.text.includes('брат')) {
          const originalEffect = choice.effect;
          modifiedChoice.effect = () => {
            originalEffect();
            gameState.feanor.wisdom += 2; // Большой бонус за попытку примирения
            gameState.feanor.pride -= 5;
          };
          modifiedChoice.reaction += "\n\n🕊️ Исцеление старых ран - величайшая мудрость!";
        }
      }
      
      return modifiedChoice;
    }

    // ============================================
    // СПЕЦИАЛЬНЫЕ СОБЫТИЯ НА ОСНОВЕ КОМБИНАЦИЙ
    // ============================================

    function checkEventCombinations(currentStage) {
      const e = gameState.events;
      const triggers = [];
      
      // Комбинация: Высокая мудрость + Жертвы + Семейная поддержка = Путь Святого
      if (e.includes('family_infusion') && 
        e.includes('showed_mercy') && 
        e.includes('yavanna_blessing') &&
        gameState.feanor.wisdom >= 70) {
        triggers.push({
          id: 'saint_path_unlocked',
          title: '✨ Путь Святого Открыт',
          text: "Манвэ является к тебе с вестью: 'Феанор, твой путь заметили не только мы. Сам Илуватар наблюдает. Продолжай, и ты можешь стать первым эльфом, вознесённым до уровня Майар при жизни.'"
        });
      }
      
      // Комбинация: Конфликт с семьёй + Конфликт с братьями + Высокая гордость = Путь Тирана
      if (e.includes('family_alienated') && 
        e.includes('drawn_sword') && 
        gameState.feanor.pride >= 80) {
        triggers.push({
          id: 'tyrant_path_warning',
          title: '⚠️ Предупреждение Мандоса',
          text: "Мандос является в видении: 'Феанор, ты идёшь путём тирании. Видел я это. Конец - кровь, пепел, проклятие. Ещё не поздно свернуть. Но окно закрывается.'"
        });
      }
      
      // Комбинация: Множество мистических событий = Трансцендентность
      const mysticalCount = getEventsByCategory('mystical').length;
      if (mysticalCount >= 4 && !e.includes('transcendence_possible')) {
        triggers.push({
          id: 'transcendence_possible',
          title: '🌌 Грань Трансцендентности',
          text: "Ты чувствуешь... изменение. Твоё тело становится полупрозрачным по краям. Сильмариллы резонируют с твоей феа. Ты стоишь на грани перехода из физического в духовное. Эльф, становящийся Майа. Что ты выберешь?"
        });
        gameState.events.push('transcendence_possible');
      }
      
      // Комбинация: Доверие к Мелькору + Последующее предательство = Месть
      if (e.includes('melkor_confidant') && 
        e.includes('betrayed_by_melkor') && 
        !e.includes('revenge_sworn')) {
        triggers.push({
          id: 'revenge_option',
          title: '⚔️ Жажда Мести',
          text: "Гнев кипит в тебе. Мелькор предал доверие! Твои сыновья видят это. Маэдрос: 'Отец, что мы будем делать?' Они готовы следовать за тобой. Даже в месть. Даже в бездну."
        });
      }
      
      // Комбинация: Помощь детям + Учительство + Скромные творения = Путь Наставника
      if (e.includes('helped_child') && 
        e.includes('inspired_child') && 
        e.includes('humble_creation') &&
        currentStage >= 7) {
        triggers.push({
          id: 'mentor_reputation',
          title: '📚 Репутация Наставника',
          text: "Слухи разлетелись по Валинору. 'Феанор учит!' Десятки молодых эльфов собираются у твоей кузницы, прося наставлений. Не только Нолдор - Ваньяр, Телери, даже гномьи посланники. Ты стал не просто мастером, но Учителем Эпохи."
        });
        gameState.events.push('mentor_reputation');
      }
      
      return triggers;
    }

    // ============================================

    function getLocationDescription(location) {
      const e = gameState.events;
      let desc = LOCATIONS[location].baseDescription;
      
      // Кузница изменяется в зависимости от событий
      if (location === 'forge') {
        if (e.includes('family_infusion')) {
          desc += "\n\nНа стенах - рисунки твоих детей. Куруфин оставил свои инструменты у твоего верстака. Место чувствуется... живым. Любимым.";
        } else if (e.includes('family_alienated')) {
          desc += "\n\nПыль на семейных портретах. Второй стул у верстака пуст - никто не работает рядом с тобой. Одиночество осязаемо.";
        }
        
        if (e.includes('used_melkor_gift')) {
          desc += "\n\nТёмное пятно в углу - там, где хранился дар Мелькора. Оно не смывается. Не уходит. Просто... есть.";

        if (e.includes('eru_blessing')) {
          desc += "\n\nСвет проникает через окно не естественно - он... священен. Словно само присутствие Эру осталось здесь.";
        }
      }
      
      // Описание Тириона
      if (location === 'tirion') {
        if (e.includes('public_reveal')) {
          desc += "\n\nЭльфы узнают тебя на улице. Кланяются. Просят автографы. Слава - и бремя, и радость.";
        } else if (e.includes('noldor_split')) {
          desc += "\n\nГород разделён. Одна половина площади - твои сторонники. Другая - Финголфина. Пустое пространство между - больно смотреть.";
        }
        
        if (e.includes('brothers_united')) {
          desc += "\n\nНа площади - статуя трёх братьев, стоящих вместе. Недавно установленная. Символ единства.";

      return desc;
    }

    const LOCATIONS = {

        baseDescription: "Твоя кузница. Горн пылает. Инструменты на своих местах. Запах металла и угля - дома."

    // ============================================
    // СИСТЕМА "ПАМЯТИ МИРА"

    // Мир помнит действия игрока и реагирует соответственно
    class WorldMemory {
      constructor() {
        this.reputation = {
          noldor: 50,  // 0-100
          vanyar: 50,
          teleri: 50,
          valar: 50,
          general: 50
        };
        this.rumors = [];
        this.legends = [];
      }
      
      updateReputation(faction, change, reason) {
        this.reputation[faction] = Math.max(0, Math.min(100, 
          this.reputation[faction] + change));
        
        if (Math.abs(change) >= 10) {
          this.rumors.push({
            faction: faction,
            text: this.generateRumor(faction, change, reason),
            turn: gameState.stage
          });
        }
      }
      
      generateRumor(faction, change, reason) {
        const positive = change > 0;
        const templates = {
          positive: [
            `Слышал? Феанор ${reason}! Какой мастер!`,
            `${reason} - Феанор показал истинное величие!`,
            `Говорят, Феанор ${reason}. Он может стать величайшим!`
          ],
          negative: [
            `Феанор ${reason}... Гордость до добра не доведёт.`,
            `Слухи о том, что Феанор ${reason}, тревожат.`,
            `${reason} - Феанор идёт опасным путём.`
          ]
        };
        
        const pool = positive ? templates.positive : templates.negative;
        return pool[Math.floor(Math.random() * pool.length)];
      }
      
      checkReputation(faction) {
        const rep = this.reputation[faction];
        if (rep >= 80) return 'revered';
        if (rep >= 60) return 'respected';
        if (rep >= 40) return 'neutral';
        if (rep >= 20) return 'disliked';
        return 'despised';
      }
      
      createLegend(eventId) {
        // Одно событие — одна легенда. Без этой проверки легенда
        // создаётся заново при каждом проходе, и репутация улетает.
        if (this.legends.some(l => l.eventId === eventId)) return;

        const legendData = {
          'ultimate_sacrifice': {
            title: 'Жертва Феанора', deed: 'отдал величайшее творение ради спасения Древ',
            text: 'Говорят, Феанор отдал величайшее творение для спасения Древ. Дети поют об этом песни.',
            impact: { valar: +20, noldor: +15, general: +25 }
          },
          'drew_sword': {
            title: 'Меч Против Брата', deed: 'обнажил меч против собственного брата',
            text: 'Шепчутся: Феанор обнажил меч против Финголфина. Брат против брата. Проклятие на доме.',
            impact: { noldor: -20, valar: -15, general: -10 }
          },
          'brothers_united': {
            title: 'Единство Трёх', deed: 'примирился с братьями и работал с ними вместе',
            text: 'Сыновья Финвэ работают вместе! Надежда для Нолдор.',
            impact: { noldor: +25, general: +15 }
          },
          'eru_blessing': {
            title: 'Благословлённый Эру', deed: 'удостоился благословения самого Илуватара',
            text: 'Сам Илуватар благословил труд Феанора! Такого не было со дней Музыки!',
            impact: { valar: +30, noldor: +20, vanyar: +25, general: +30 }
          }
        };
        
        if (legendData[eventId]) {
          const legend = Object.assign({ eventId: eventId }, legendData[eventId]);
          this.legends.push(legend);
          for (let faction in legend.impact) {
            // В слух идёт не заголовок легенды, а глагольная фраза:
            // иначе выходило «Феанор Благословлённый Эру. Какой мастер!»
            this.updateReputation(faction, legend.impact[faction], legend.deed || legend.title);
          }
        }
      }
    }

    // Инициализация памяти мира
    if (!gameState.worldMemory) {

    // Единая таблица имён материалов. Прежняя знала 8 идентификаторов,
    // из которых 5 не выдаются вовсе, и не знала 17 выдаваемых —

    const MATERIAL_NAMES = {
      'star_dust': 'Звёздная пыль Варды',

      'telperion_dew': 'Роса Телпериона',

    function formatText(text) {
      if (text === null || text === undefined) return '';
      if (typeof text !== 'string') text = String(text);

      // Текст стадий приходит с \n\n между абзацами и уже может
      // содержать разметку — теги не экранируем, но переводы строк
      // превращаем в абзацы, иначе всё слипается в полотно.
      if (/<(p|div|br)\b/i.test(text)) return text;

      return text
        .split(/\n{2,}/)
        .map(p => p.trim())
        .filter(p => p.length)
        .map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>')
        .join('');
    }

    function renderChoices(choices) {
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      if (!choices || !choices.length) return;

      // Условная доступность выбора. Прежде её не было вовсе:
      // triggerConditions в движке понимают только мини-события,
      // а выборы стадий показывались все подряд.
      choices = choices.filter(c => typeof c.when !== 'function' || c.when());

      // Вторая проверка — через shouldShowOption, которая была
      // написана и не вызывалась: у выборов не было optionId.
      // Она же умеет отвечать бонусом, и он показывается припиской.
      choices = choices.filter(c => {
        const v = optionAllowed(c, gameState.stage);
        c.__bonus = v.bonus;
        return v.ok;
      });

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        if (choice.__bonus) {
          const hint = document.createElement('span');
          hint.style.cssText = 'color:#8fbf8f; font-size:0.88em; margin-left:8px;';
          hint.textContent = '(прежнее сотрудничество помогает)';
          btn.appendChild(hint);
        }
        btn.onclick = () => {
          choice.effect();
          updateStats();

          // Легенда о поступке: события, попавшие в реестр легенд,
          // меняют репутацию у фракций. Прежде createLegend не
          // вызывался ниоткуда, и легенды не появлялись никогда.
          if (gameState.worldMemory) {
            gameState.events.slice(-3).forEach(id => {
              gameState.worldMemory.createLegend(id);
            });
          }

          if (choice.reaction) {
            const reactionText = typeof choice.reaction === 'function'
              ? choice.reaction()
              : choice.reaction;
            showReactionAndProceed(reactionText, choice.next);
          } else {
            renderStage(choice.next);
          }
        };
        choicesDiv.appendChild(btn);
      });
    }

    // ============================================
    // ГАЛАДРИЭЛЬ: перенаправление на под-стадии
    //
    // Под-стадии 2b, 2c и 5g_hair в обоих пакетах написаны, но ни один
    // выбор на них не ведёт: в 2a все next: 2. Пакет предлагал
    // возвращать navigateToStage() прямо из text(), что сломало бы
    // отрисовку. Здесь перенаправление сделано на входе в сцену.
    // ============================================

    function galadrielRedirect(stageId) {
      const g = gameState.galadriel;
      if (!g) return stageId;

      // КАЖДОЕ перенаправление срабатывает не более одного раза за партию.
      //
      // Без этого любая ветвь сцены, которая не меняет условие входа,
      // возвращает игрока в ту же сцену бесконечно. Таких ветвей три:
      //   2b   «Оставить её в покое - больше не просить» не трогает asks;
      //   2c   «Не просить - принять уроки» и «Обвинить её в жестокости»
      //        не трогают asks;
      //   5g_hair  «Попытаться примириться» и «Продолжить работу без
      //        отвлечений» не выставляют ни один из трёх флагов.
      // Все они уходят на стадию, с которой перенаправление начинается.
      //
      // Чинить это выставлением asks в самих ветвях НЕЛЬЗЯ: asks — счётчик
      // просьб, а игрок в этих ветвях как раз НЕ просит. Врать счётчику,
      // чтобы выбраться из петли, — лечить симптом.
      g.redirected = g.redirected || {};
      const once = (key, target) => {
        if (g.redirected[key]) return null;
        g.redirected[key] = true;
        return target;
      };

      // Вторая просьба: после первой, если не разругались насмерть.
      if (String(stageId) === '3' && g.asks === 1 &&
        !gameState.events.includes('alienated_galadriel') &&
        !gameState.events.includes('galadriel_gave_hair')) {
        const r = once('2b', "2b");
        if (r) return r;
      }

      // Третья просьба. Не предлагается, если волосы уже отданы:
      // иначе Галадриэль дарит их дважды и в материалах оказывается
      // две пряди.
      if (String(stageId) === '5' && g.asks === 2 &&
        !gameState.events.includes('galadriel_gave_hair') &&
        !gameState.events.includes('galadriel_gave_one_hair') &&
        !gameState.events.includes('alienated_galadriel')) {
        const r = once('2c', "2c");
        if (r) return r;
      }

      // Работа с полученными волосами — до общей стадии 5.
      if (String(stageId) === '5' &&
        gameState.materials.includes('galadriel_hair') &&
        !gameState.events.includes('hair_woven_into_core') &&
        !gameState.events.includes('hair_as_crown') &&
        !gameState.events.includes('lesson_internalized')) {
        const r = once('5g_hair', "5g_hair");
        if (r) return r;
      }

      return stageId;
    }

    // ============================================
    // СЛУЧАЙНЫЕ ХРОНИКИ И БОЛЬШИЕ ПРОИСШЕСТВИЯ
    //
    // getRandomEvent() (25 однострочных вестей) и
    // getRandomComplexEvent() (10 сцен с выборами: Том Бомбадил,
    // Тулкас с молотом и армрестлингом, призрак Мириэль, портал в
    // иную явь, «Эру моргнул», поющие Древа) были написаны и НИ РАЗУ
    // не вызывались — ни в исходном черновике, ни после починки.
    // Здесь они подключены к тому же показу, что и мини-события.
    //
    // Частоты настраиваются здесь. Ноль полностью выключает.
    // ============================================

    const CHRONICLE_CHANCE = 0.22;   // однострочная весть
    const HAPPENING_CHANCE  = 0.14;  // большая сцена с выборами

    // Большие происшествия хранятся тут же, чтобы handleMiniEventChoice
    // находил их наравне с обычными мини-событиями.
    const HAPPENINGS_SHOWN = [];

    function maybeShowChronicle(stageId, textDiv) {
      // Не на первом экране и не в эпилоге: там своя музыка.
      const sid = String(stageId);
      if (sid === '0' || /^9/.test(sid)) return;

      if (Math.random() < HAPPENING_CHANCE) {
        const ev = getRandomComplexEvent();
        if (ev && !gameState.events.includes('happening_' + ev.text.slice(0, 24))) {
          gameState.events.push('happening_' + ev.text.slice(0, 24));
          const packed = {
            id: 'happening_' + HAPPENINGS_SHOWN.length,
            title: 'Происшествие',
            text: ev.text,
            choices: ev.choices
          };
          // В MINI_EVENTS_POOL класть нельзя: отбор мини-событий
          // ждёт от элементов stageRange и frequency, которых у
          // происшествия нет, и падает на них. Держим отдельно,
          // а handleMiniEventChoice научен искать и здесь.
          HAPPENINGS_SHOWN.push(packed);
          displayMiniEvent(packed, textDiv);
          updateStats();
          return;
        }
      }

      if (Math.random() < CHRONICLE_CHANCE) {
        const line = getRandomEvent();
        if (typeof line === 'string' && line.length) {
          textDiv.innerHTML += `<div class="chronicle-line ${chronicleClass(line)}" style="
            margin: 14px 0;
            padding: 10px 14px;
            border-left: 3px solid #5c7cfa;
            background: rgba(40, 45, 70, 0.35);
            border-radius: 4px;
            color: #b9c6e8;
            font-style: italic;
            line-height: 1.6;
          ">${line}</div>`;
        }
      }
    }

    // ============================================
    // ГРУППА А: подключение написанного, но не вызывавшегося
    //
    // getAchievementEvent, getEventStyle, getEventStyleForPhase,
    // getLocationDescription, generateEndingStats, getJourneyStatistics
    // были объявлены и ни разу не позваны. Здесь для них сделано
    // недостающее — вызов и то немногое, чего им не хватало.
    // ============================================

    // getJourneyStatistics читает wisdomHistory / skillHistory /
    // prideHistory, которых в gameState не существовало. Собираем.
    function recordStatHistory() {
      const f = gameState.feanor;
      if (!gameState.wisdomHistory) {
        gameState.wisdomHistory = [];
        gameState.skillHistory  = [];
        gameState.prideHistory  = [];
      }
      gameState.wisdomHistory.push(f.wisdom);
      gameState.skillHistory.push(f.skill);
      gameState.prideHistory.push(f.pride);
    }

    // Место действия. LOCATIONS знает кузницу и Тирион; описание
    // getLocationDescription дописывает по накопленным событиям.
    function currentLocation(stageId) {
      const sid = String(stageId);
      return (sid === '1' || sid === '1a' || sid === '1b' || sid === '0c') ? 'tirion' : 'forge';
    }

    function showLocationLine(stageId, textDiv) {
      const sid = String(stageId);
      // Только на переходах между актами: иначе повторяется на каждом
      // экране и надоедает.
      if (!/^\d+$/.test(sid)) return;
      if (!gameState.locationShown) gameState.locationShown = [];
      if (gameState.locationShown.includes(currentLocation(stageId) + ':' + sid)) return;
      gameState.locationShown.push(currentLocation(stageId) + ':' + sid);

      const desc = getLocationDescription(currentLocation(stageId));
      if (!desc) return;
      textDiv.innerHTML += `<div class="location-line">${desc.replace(/\n\n/g, '<br><br>')}</div>`;
    }

    // Достижения при выходе характеристики на предел.
    function showAchievements(textDiv) {
      const list = getAchievementEvent();
      if (!list || !list.length) return;
      textDiv.innerHTML += `<div class="achievement-flash">${list.join('<br>')}</div>`;
    }

    // Стиль строки события. getEventStyle разбирает текст по эмодзи
    // (тревога, волшебство, тьма, комическое), getEventStyleForPhase
    // красит по фазе Древ. Оба класса вешаются вместе: смысл события
    // задаёт цвет, фаза Древ — фон. Все двенадцать классов в стилях
    // уже были, ими просто никто не пользовался.
    function chronicleClass(line) {
      return getEventStyle(line) + ' ' + getEventStyleForPhase(line);
    }

    function renderStageWithEvents(stageId) {
      stageId = galadrielRedirect(stageId);
      const stage = stages.find(s => String(s.id) === String(stageId));
      const textDiv = document.getElementById('gameText');

      if (!stage) {
        renderEnding();
        return;
      }

      // --- накопленное прошлое ------------------------------------
      syncEchoes();
      applyDeedTaint();
      applyEchoEffects(stageId);
      const phaseChange = advanceTreePhase();

      // --- содержимое стадии --------------------------------------
      let stageText, stageChoices;
      if (stage.dynamicStage && stage.getContent) {
        const content = stage.getContent();
        stageText = content.text;
        stageChoices = content.choices;
      } else {
        stageText = typeof stage.text === 'function' ? stage.text() : stage.text;
        stageChoices = stage.choices;
      }

      // Контекстные вставки и реакции персонажей: работают с сырым
      // текстом, поэтому идут до форматирования.
      const context = determineSceneContext(stageId, stageText);
      stageText = getDynamicNarrativeText(stageText, context);

      getActiveCharacters(stageId, stageText).forEach(char => {
        const reaction = getCharacterReaction(char);
        if (reaction) stageText += "\n\n" + reaction;
      });

      // --- отрисовка ----------------------------------------------
      const phaseDisplay = `<div class="tree-phase-display">${getTreePhaseDescription()}</div>`;
      textDiv.innerHTML = phaseDisplay + formatText(stageText);

      if (gameState.anomalyActive) {
        textDiv.innerHTML += `<div class="anomaly-warning">
          ⚠️ Валар встревожены! Такого не случалось с момента создания Древ!
        </div>`;
      }

      // Специальные события от комбинаций — после основного текста,
      // чтобы дописывались под ним, а не затирались им.
      checkEventCombinations(stageId).forEach(trigger => {
        displaySpecialEvent(trigger);
        if (trigger.id && !gameState.events.includes(trigger.id)) {
          gameState.events.push(trigger.id);
        }
      });

      if (gameState.materials.length > 0) {
        const materials = gameState.materials
          .map(m => MATERIAL_NAMES[m] || m).join(', ');
        textDiv.innerHTML += `<div class="materials-display">Собранные материалы: ${materials}</div>`;
      }

      if (shouldTriggerMiniEvent(stageId)) {
        const miniEvent = selectMiniEvent(stageId);
        if (miniEvent) {
          displayMiniEvent(miniEvent, textDiv);
          updateStats();
        }
      } else {
        // Хроники и происшествия — только если штатного
        // мини-события на этом экране не выпало: два подряд
        // забивают собственно сцену.
        maybeShowChronicle(stageId, textDiv);
      }

      const warnings = [];
      if (gameState.feanor.pride >= 90) warnings.push("⚠️ Твоя гордость достигла опасного уровня!");
      if (gameState.feanor.wisdom <= 20) warnings.push("⚠️ Ты теряешь мудрость в погоне за величием!");
      if (gameState.silmarils.purity <= 20 && gameState.silmarils.power > 0) warnings.push("⚠️ Тьма проникает в Сильмариллы!");
      if (gameState.silmarils.power >= 90) warnings.push("⚡ Сильмариллы пульсируют невероятной мощью!");
      if (warnings.length > 0) {
        textDiv.innerHTML += `<div class="special-event">${warnings.join('<br>')}</div>`;
      }

      // Описание места, меняющееся от накопленных событий.
      showLocationLine(stageId, textDiv);

      // Достижения при выходе характеристики на предел.
      showAchievements(textDiv);

      // Репутация показывается, только когда стала заметной.
      displayReputationIfNotable();

      // --- выборы --------------------------------------------------
      renderChoices(stageChoices.map(choice => modifyChoiceByEvents(choice, stageId)));
    }

    function determineSceneContext(stageId, knownText) {
      // Текст передаётся готовым: у динамических стадий его нет
      // в stage.text, и повторный вызов давал null.
      let text = knownText;
      if (typeof text !== 'string') {
        const stage = stages.find(s => String(s.id) === String(stageId));
        if (!stage) return 'neutral';
        text = typeof stage.text === 'function' ? stage.text() : stage.text;
      }
      if (typeof text !== 'string') return 'neutral';
      const lowerText = text.toLowerCase();
      
      if (lowerText.includes('нерданель') || lowerText.includes('сын') || lowerText.includes('семь')) {
        return 'family_scene';
      }
      if (lowerText.includes('финголфин') || lowerText.includes('финарфин') || lowerText.includes('брат')) {
        return 'brothers_scene';
      }
      if (lowerText.includes('мелькор')) {
        return 'melkor_scene';
      }
      if (lowerText.includes('манвэ') || lowerText.includes('вал') || lowerText.includes('йаванна')) {
        return 'valar_scene';
      }
      
      return 'neutral';
    }

    function getActiveCharacters(stageId, knownText) {
      let text = knownText;
      if (typeof text !== 'string') {
        const stage = stages.find(s => String(s.id) === String(stageId));
        if (!stage) return [];
        text = typeof stage.text === 'function' ? stage.text() : stage.text;
      }
      if (typeof text !== 'string') return [];
      const characters = [];
      
      if (text.includes('Нерданель')) characters.push('nerdanel');
      if (text.includes('Маэдрос')) characters.push('maedhros');
      if (text.includes('Финголфин')) characters.push('fingolfin');
      if (text.includes('Мелькор')) characters.push('melkor');
      if (text.includes('Манвэ')) characters.push('manwe');
      if (text.includes('Финвэ')) characters.push('finwe');
      
      return characters;
    }

    function displayReputationIfNotable() {
      const wm = gameState.worldMemory;
      const notable = [];
      
      for (let faction in wm.reputation) {
        const status = wm.checkReputation(faction);
        if (status === 'revered' || status === 'despised') {
          notable.push({
            faction: faction,
            status: status,
            value: wm.reputation[faction]
          });
        }
      }
      
      if (notable.length > 0) {
        let repHtml = `
          <div class="reputation-display" style="
            background: rgba(30, 30, 50, 0.8);
            border-left: 4px solid #4169e1;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
          ">
            <h4 style="color: #87ceeb; margin-bottom: 10px;">📊 Твоя репутация:</h4>
        `;
        
        notable.forEach(n => {
          const emoji = n.status === 'revered' ? '⭐' : '⚠️';
          const color = n.status === 'revered' ? '#00ff00' : '#ff6b6b';
          const statusText = n.status === 'revered' ? 'Почитаем' : 'Презираем';
          
          repHtml += `
            <div style="margin: 8px 0; color: ${color};">
              ${emoji} <strong>${n.faction.charAt(0).toUpperCase() + n.faction.slice(1)}:</strong> 
              ${statusText} (${n.value})
            </div>
          `;
        });
        
        // Добавляем последние слухи
        if (wm.rumors.length > 0) {
          const recentRumors = wm.rumors.slice(-3);
          repHtml += `<div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #555;">
            <em style="color: #aaa; font-size: 0.95em;">Последние слухи:</em><br>`;
          recentRumors.forEach(rumor => {
            repHtml += `<div style="color: #ccc; font-size: 0.9em; margin: 5px 0;">"${rumor.text}"</div>`;
          });
          repHtml += `</div>`;
        }
        
        repHtml += `</div>`;
        
        document.getElementById('gameText').insertAdjacentHTML('beforeend', repHtml);
      }
    }

    // ============================================
    // ЗАЖИМ ХАРАКТЕРИСТИК В 0..100
    //
    // В игре его не было вовсе: условия писались под шкалу до сотни,
    // а значения уходили втрое выше (мудрость к 195) и в минус
    // (гордость до −80). Из-за этого пороги срабатывали одинаково
    // при любом выборе игрока. Зажим ставится в updateStats,
    // которая зовётся после каждого изменения.

    function clampStats() {
      const f = gameState.feanor, s = gameState.silmarils;
      if (typeof recordStatHistory === 'function') recordStatHistory();
      f.wisdom = Math.max(0, Math.min(100, Math.round(f.wisdom)));
      f.skill  = Math.max(0, Math.min(100, Math.round(f.skill)));
      f.pride  = Math.max(0, Math.min(100, Math.round(f.pride)));
      s.light  = Math.max(0, Math.min(100, Math.round(s.light)));
      s.purity = Math.max(0, Math.min(100, Math.round(s.purity)));
      s.power  = Math.max(0, Math.min(100, Math.round(s.power)));
    }

    function updateStats() {
      clampStats();
      document.getElementById('wisdom').textContent = gameState.feanor.wisdom;
      document.getElementById('skill').textContent = gameState.feanor.skill;
      document.getElementById('pride').textContent = gameState.feanor.pride;
      document.getElementById('light').textContent = gameState.silmarils.light;
      document.getElementById('purity').textContent = gameState.silmarils.purity;
      document.getElementById('power').textContent = gameState.silmarils.power;
      
      // Подсветка критических значений
      const stats = [
        { id: 'wisdom', value: gameState.feanor.wisdom },
        { id: 'skill', value: gameState.feanor.skill },
        { id: 'pride', value: gameState.feanor.pride },
        { id: 'light', value: gameState.silmarils.light },
        { id: 'purity', value: gameState.silmarils.purity },
        { id: 'power', value: gameState.silmarils.power }
      ];
      
      stats.forEach(stat => {
        const element = document.getElementById(stat.id);
        element.style.color = '#ffd700'; // Сброс цвета
        element.style.textShadow = 'none'; // Сброс тени
        
        if (stat.value >= 80) {
          element.style.color = '#00ff00';
          element.style.textShadow = '0 0 10px rgba(0, 255, 0, 0.8)';
        } else if (stat.value >= 60) {
          element.style.color = '#ffff00';
          element.style.textShadow = '0 0 8px rgba(255, 255, 0, 0.6)';
        } else if (stat.value <= 20) {
          element.style.color = '#ff4444';
          element.style.textShadow = '0 0 8px rgba(255, 68, 68, 0.6)';
        }
        
        // Особое свечение для экстремальных значений
        if (stat.value >= 100) {
          element.style.color = '#ffffff';
          element.style.textShadow = '0 0 15px rgba(255, 255, 255, 1)';
          element.style.animation = 'pulse 1s infinite';
        } else if (stat.value <= 0) {
          element.style.color = '#8b0000';
          element.style.textShadow = '0 0 10px rgba(139, 0, 0, 0.8)';
        }
      });
    }

    function shouldTriggerMiniEvent(currentStage) {
      // Не на первой и последней стадии
      if (currentStage <= 1 || currentStage >= 9) return false;
      
      // Базовый шанс 35%
      let chance = 0.35;
      
      // Увеличение шанса в зависимости от условий
      if (gameState.feanor.pride >= 70) chance += 0.15; // Высокая гордость = больше событий
      if (gameState.events.length >= 10) chance += 0.10; // Богатая история = больше событий
      if ([3, 5, 7].includes(currentStage)) chance += 0.20; // Ключевые стадии
      
      return Math.random() < chance;
    }

    // Обработчик выбора в мини-событии
    window.handleMiniEventChoice = function(eventId, choiceIndex) {
      const event = MINI_EVENTS_POOL.find(e => e.id === eventId)
             || HAPPENINGS_SHOWN.find(e => e.id === eventId);
      if (!event || !event.choices || !event.choices[choiceIndex]) return;
      
      const choice = event.choices[choiceIndex];
      
      // Применяем эффект
      choice.effect();
      updateStats();
      
      // Показываем реакцию
      const choicesDiv = document.querySelector('.mini-event-choices');
      if (choicesDiv) {
        choicesDiv.innerHTML = `
          <div style="
            padding: 15px;
            background: linear-gradient(135deg, rgba(0, 100, 0, 0.3), rgba(0, 150, 0, 0.2));

            border-radius: 8px;
            margin-top: 15px;

          ">
            <p style="color: #98fb98; line-height: 1.6; margin: 0;">
              ${choice.reaction}
            </p>
          </div>
        `;
      }
      
      // Автоматически продолжаем после 3 секунд
      setTimeout(() => {
        const miniEventDiv = document.querySelector('.mini-event');
        if (miniEventDiv) {
          miniEventDiv.style.animation = 'fadeOut 0.5s';
          setTimeout(() => miniEventDiv.remove(), 500);
        }
      }, 3000);
    };

    function getEnding() {
      const path = determinePath();
      const s = gameState.silmarils;
      const f = gameState.feanor;
      const e = gameState.events;
      
      console.log('Path analysis:', path);
      console.log('Event score:', path.score);
      
      // СЕКРЕТНЫЕ КОНЦОВКИ (проверяем в первую очередь)
      if (checkSecretEnding()) {
        return getSecretEnding();
      }
      
      // КОНЦОВКИ ЖЕРТВЫ (приоритет - самые драматичные)
      if (e.includes('ultimate_sacrifice')) {
        return getSacrificeEnding();
      }
      
      // БОЖЕСТВЕННЫЕ КОНЦОВКИ (очень высокие требования)
      if (path.score >= 100 && s.purity >= 85 && f.wisdom >= 80 && f.pride <= 35) {
        return getDivineEnding();
      }
      
      // МИСТИЧЕСКИЕ КОНЦОВКИ
      if (path.mainPath === 'mystical' && path.mystical >= 3) {
        return getMysticalEnding();
      }
      
      // ИСКУПИТЕЛЬНЫЕ КОНЦОВКИ
      if ((e.includes('showed_mercy') || e.includes('redemption_moment') ||
        (path.score > 50 && f.pride < 40)) && isPathAvailable('redemption')) {
        return getRedemptiveEnding();
      }
      
      // СЕМЕЙНЫЕ КОНЦОВКИ
      if (path.mainPath === 'family' && gameState.choices.familySupport === true &&
        isPathAvailable('family')) {
        return getFamilyEnding();
      }
      
      // КОНЦОВКА СМИРЕНИЯ (путь Галадриэль)
      if ((e.includes('transcended_desire') || e.includes('galadriel_ultimate_gift')) &&
        f.pride < 35 && f.wisdom > 75) {
        return getHumilityEnding();
      }

      // КОНЦОВКА САДОВНИКА (из авторской спецификации)
      if (e.includes('became_gardener') || e.includes('enlightenment_at_roots') ||
        (e.includes('seeds_of_light_shared') && e.includes('new_trees_created'))) {
        return getGardenerEnding();
      }

      // ПОЛИТИЧЕСКИЕ КОНЦОВКИ
      if (isPathAvailable('political') &&
        (path.mainPath === 'political' || e.includes('three_kingdoms') ||
         e.includes('council_created'))) {
        return getPoliticalEnding();
      }
      
      // ПРОВАЛЬНЫЕ КОНЦОВКИ — подняты выше трагических и тёмных.
      // Внизу каскада они были мертвы: тёмные ворота ловят любую
      // чистоту <= 30, а трагические — любую гордость >= 80.
      if (s.light + s.purity + s.power <= 120) {
        return getFailureEnding();
      }
      
      // ТРАГИЧЕСКИЕ КОНЦОВКИ (высокая гордость + конфликты)
      if (f.pride >= 80 || e.includes('drawn_sword') || e.includes('noldor_split')) {
        return getTragicEnding();
      }
      
      // ТЁМНЫЕ КОНЦОВКИ (связь с Мелькором или низкая чистота)
      if (path.mainPath === 'melkor' || s.purity <= 30 || 
        e.includes('used_melkor_gift') || e.includes('betrayed_by_melkor')) {
        return getDarkEnding();
      }
      
      // НЕЙТРАЛЬНАЯ КОНЦОВКА
      return getNeutralEnding();
    }

    function checkSecretEnding() {
      const e = gameState.events;
      const s = gameState.silmarils;
      const f = gameState.feanor;
      
      // Концовка "Совершенный Баланс"
      if (Math.abs(s.light - s.purity) <= 10 && 
        Math.abs(s.purity - s.power) <= 10 &&
        Math.abs(s.power - s.light) <= 10 &&
        s.light >= 60 && s.purity >= 60 && s.power >= 60) {
        gameState.secretEnding = 'perfect_balance';
        return true;
      }
      
      // Концовка "Мастер всех путей"
      if (['family', 'political', 'melkor', 'mystical', 'sacrifice']
          .every(c => getEventsByCategory(c).length > 0)) {
        gameState.secretEnding = 'master_all_paths';
        return true;
      }
      
      // Концовка "Парадокс Мелькора"
      if (e.includes('showed_mercy') && e.includes('melkor_enemy') && 
        e.includes('light_weapon')) {
        gameState.secretEnding = 'melkor_paradox';
        return true;
      }
      
      // Концовка "Дух в камне"
      if (e.includes('spirit_sacrifice') && gameState.materials.includes('blood_crystal') && 
        e.includes('fea_fusion')) {
        gameState.secretEnding = 'spirit_stone';
        return true;
      }
      
      // Концовка "Коллекционер всего"
      if (gameState.materials.length >= 3 && gameState.events.length >= 20) {
        gameState.secretEnding = 'ultimate_collector';
        return true;
      }
      
      return false;
    }

    function determineEndingCategory() {
      const s = gameState.silmarils;
      const f = gameState.feanor;
      const e = gameState.events;
      
      // Божественная - все максимум + смирение
      if (s.light >= 90 && s.purity >= 90 && s.power >= 80 && 
        f.wisdom >= 80 && f.pride <= 40) {
        return 'divine';
      }
      
      // Трагическая - высокая гордость + определённые события
      if (f.pride >= 85 && (e.includes('house_heritage') || 
        e.includes('drawn_sword') || e.includes('noldor_split'))) {
        return 'tragic';
      }
      
      // Искупительная - была гордость, но смирился
      if (e.includes('redemption_moment') || e.includes('showed_mercy') ||
        e.includes('universal_dedication')) {
        return 'redemptive';
      }
      
      // Семейная - сильная поддержка семьи
      if (gameState.choices.familySupport === true && 
        (e.includes('family_heritage') || e.includes('family_infusion'))) {
        return 'family';
      }
      
      // Политическая - фокус на политике и единстве
      if (e.includes('brothers_united') || e.includes('three_kingdoms') ||
        e.includes('council_created')) {
        return 'political';
      }
      
      // Мистическая - особые события и методы
      if (e.includes('crystallized_music') || e.includes('eru_blessing') ||
        e.includes('new_trees_created') || e.includes('living_silmarils')) {
        return 'mystical';
      }
      
      // Провальная - очень низкие характеристики
      if (s.light + s.purity + s.power <= 120) {
        return 'failure';
      }
      
      // Тёмная - связь с Мелькором или низкая чистота
      if (s.purity <= 30 || e.includes('used_melkor_gift') ||
        e.includes('betrayed_by_melkor')) {
        return 'dark';
      }
      
      return 'neutral';
    }
