          </div>
          ${ending.achievement ? `
            <div style="background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(135, 206, 235, 0.2)); 
               padding: 15px; border-radius: 10px; margin: 20px 0; text-align: center; 
               border: 2px solid #ffd700; animation: shimmer 3s infinite;">
              <strong style="font-size: 1.2em; color: #ffd700;">${ending.achievement}</strong>
            </div>
          ` : ''}
          <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #444;">
            <h3 style="font-family: 'Cinzel', serif; color: #87ceeb; margin-bottom: 15px;">Достижения Пути:</h3>
            <p style="font-size: 1.1em; line-height: 1.8;">
              ${achievements.length > 0 ? achievements.join('<br>') : '📜 Скромный Путь'}
            </p>
          </div>
          ${(() => {
            // generateEndingStats и getJourneyStatistics были
            // написаны и никогда не вызывались. Здесь их сводки
            // наконец показываются игроку.
            const st = generateEndingStats();
            const jr = getJourneyStatistics();
            const rel = r => r === true ? 'да' : r === false ? 'нет' : '—';
            return `
            <div style="margin-top: 20px; padding: 20px; background: rgba(10, 10, 20, 0.6); border-radius: 10px;">
              <h3 style="font-family: 'Cinzel', serif; color: #87ceeb; margin-bottom: 15px;">Итоги Пути:</h3>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.98em;">
                <div><strong>Событий пережито:</strong> ${st.journey.eventsTriggered}</div>
                <div><strong>Материалов собрано:</strong> ${st.journey.materialsGathered}</div>
                <div><strong>Малых происшествий:</strong> ${st.journey.miniEventsExperienced}</div>
                <div><strong>Отголосков решений:</strong> ${st.journey.echosGenerated}</div>
                <div><strong>Циклов света Древ:</strong> ${st.journey.phaseCycles || 0}</div>
                <div><strong>Ключевых мгновений:</strong> ${jr.keyMoments.length}</div>
              </div>
              <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid #333; font-size: 0.98em;">
                <strong style="color: #87ceeb;">Вершины:</strong>
                мудрость ${jr.peakStats.maxWisdom},
                мастерство ${jr.peakStats.maxSkill},
                гордость ${jr.peakStats.maxPride}
              </div>
              <div style="margin-top: 10px; font-size: 0.98em;">
                <strong style="color: #87ceeb;">Опоры:</strong>
                семья — ${rel(jr.relationshipStatus.family)},
                Валар — ${rel(jr.relationshipStatus.valar)},
                Мелькор — ${jr.relationshipStatus.melkor || '—'}
              </div>
            </div>
            `;
          })()}
          ${(() => {
            // hasConflictingEvents и getEventModifiers были
            // написаны и не вызывались. Здесь показывается их
            // работа: противоречия пути и накопленные склонности.
            const conf = activeConflicts();
            const tend = deedTendencies();
            if (!conf.length && !tend.named.length) return '';
            const sign = v => (v > 0 ? '+' : '') + v;
            return `
            <div style="margin-top: 20px; padding: 20px; background: rgba(30, 16, 16, 0.55); border-radius: 10px; border-left: 4px solid #a05050;">
              <h3 style="font-family: 'Cinzel', serif; color: #d99; margin-bottom: 12px;">Чем был путь:</h3>
              ${tend.named.length ? `
                <div style="font-size: 0.98em; margin-bottom: ${conf.length ? '14px' : '0'};">
                  ${tend.named.map(([k, v]) => `<strong>${k}:</strong> ${sign(v)}`).join(' &nbsp;·&nbsp; ')}
                  <div style="color: #9a8; font-size: 0.9em; margin-top: 6px;">
                    То, к чему тянули дела, — не то же, что вышло в числах.
                  </div>
                </div>
              ` : ''}
              ${conf.length ? `
                <div style="border-top: 1px solid #543; padding-top: 12px; font-size: 0.98em; line-height: 1.7;">
                  ${conf.map(c => '— ' + c.note).join('<br>')}
                </div>
              ` : ''}
            </div>
            `;
          })()}
          <div style="margin-top: 20px; padding: 20px; background: rgba(10, 10, 20, 0.6); border-radius: 10px;">
            <h3 style="font-family: 'Cinzel', serif; color: #87ceeb; margin-bottom: 15px;">Финальные Характеристики:</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 1em;">
              <div><strong>Мудрость Феанора:</strong> <span style="color: ${f.wisdom >= 70 ? '#00ff00' : f.wisdom >= 40 ? '#ffff00' : '#ff6b6b'}">${gameState.feanor.wisdom}</span></div>
              <div><strong>Мастерство Феанора:</strong> <span style="color: ${f.skill >= 70 ? '#00ff00' : f.skill >= 40 ? '#ffff00' : '#ff6b6b'}">${gameState.feanor.skill}</span></div>
              <div><strong>Гордость Феанора:</strong> <span style="color: ${f.pride >= 70 ? '#ff6b6b' : f.pride >= 40 ? '#ffff00' : '#00ff00'}">${gameState.feanor.pride}</span></div>
              <div><strong>Свет Сильмариллов:</strong> <span style="color: ${s.light >= 70 ? '#00ff00' : s.light >= 40 ? '#ffff00' : '#ff6b6b'}">${gameState.silmarils.light}</span></div>
              <div><strong>Чистота Сильмариллов:</strong> <span style="color: ${s.purity >= 70 ? '#00ff00' : s.purity >= 40 ? '#ffff00' : '#ff6b6b'}">${gameState.silmarils.purity}</span></div>
              <div><strong>Сила Сильмариллов:</strong> <span style="color: ${s.power >= 70 ? '#00ff00' : s.power >= 40 ? '#ffff00' : '#ff6b6b'}">${gameState.silmarils.power}</span></div>
            </div>
          </div>
          <div style="margin-top: 15px; padding: 15px; background: rgba(40, 40, 60, 0.4); border-radius: 8px; border-left: 3px solid #87ceeb;">
            <p style="font-size: 0.95em; color: #ddd; line-height: 1.6;">
              <strong>Собрано материалов:</strong> ${gameState.materials.length}<br>
              <strong>Произошло событий:</strong> ${gameState.events.length}<br>
              <strong>Метод обработки:</strong> ${getMethodName(gameState.choices.method)}<br>
              <strong>Отношения с Мелькором:</strong> ${getMelkorRelationName(gameState.choices.melkorRelation)}<br>
              <strong>Поддержка семьи:</strong> ${gameState.choices.familySupport === true ? 'Да' : gameState.choices.familySupport === 'partial' ? 'Частичная' : 'Нет'}
            </p>
          </div>
          <div style="margin-top: 20px; text-align: center; padding: 15px; background: rgba(0, 0, 0, 0.4); border-radius: 8px;">
            <p style="font-size: 0.9em; color: #aaa;">
              🎮 Концовка: ${categoryName}<br>
              🌟 Подпись пути: #${endingNumber}<br>
              📊 Глубина прохождения: ${depth}%
            </p>
          </div>
        </div>
      `;
      
      choicesDiv.innerHTML = `
        <button class="restart-btn" onclick="location.reload()" style="animation: glow 2s infinite;">
          🔄 Переписать судьбу Феанора
        </button>
        <div style="text-align: center; margin-top: 15px; color: #888; font-size: 0.95em; line-height: 1.6;">
          Каждый выбор ведёт к новой истории.<br>
          Сколько путей Феанора ты сможешь открыть?
        </div>
      `;
    }
    
    // Запуск игры
    updateStats();
    renderStage(0);
  </script>
</body>
</html>
