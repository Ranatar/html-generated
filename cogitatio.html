<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cogitatio Perpetua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050201;overflow:hidden;cursor:default}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #scan{position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.30) 2px,rgba(0,0,0,.30) 3px)}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.9) 100%)}
  #ui{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;
    opacity:0;transition:opacity .6s;font:18px VT323,ui-monospace,monospace;z-index:5}
  #ui.show{opacity:1}
  #ui button{background:rgba(10,4,2,.75);color:#d9a04c;border:1px solid rgba(201,149,67,.55);
    font:inherit;padding:3px 10px;cursor:pointer;letter-spacing:.04em}
  #ui button:hover{background:rgba(60,24,8,.85);color:#ffd28a}
  #ui span{color:rgba(217,160,76,.6);margin-left:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scan"></div>
<div id="vig"></div>
<div id="ui">
  <button data-a="heresy" title="H">Ересь</button>
  <button data-a="pal" title="G">Люминофор</button>
  <button data-a="pause" title="P">Пауза</button>
  <button data-a="fs" title="F">Во весь экран</button>
  <span>H · G · P · F</span>
</div>
<script>
'use strict';
/* ---------- утилиты ---------- */
const TAU = Math.PI * 2;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backOut = x => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hex = d => Math.floor(Math.random() * 16 ** d).toString(16).toUpperCase().padStart(d, '0');
const bin8 = () => ((Math.random() * 256) | 0).toString(2).padStart(8, '0');
const toBin = s => [...s.replace(/[·,]/g, ' ')].map(c => (c.charCodeAt(0) & 255).toString(2).padStart(8, '0')).join(' ');
const randBin = n => Array.from({ length: n }, bin8).join(' ');
const randHex = n => Array.from({ length: n }, () => hex(4)).join(' ');
const pol = (a, r) => [Math.sin(a) * r, -Math.cos(a) * r];         // угол 0 — вверх, по часовой
const dirAng = (dx, dy) => Math.atan2(dx, -dy);
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* ---------- слова ---------- */
const LIT = [
  'In machina spiritus · in numero veritas',
  'Motus animat metallum',
  'Nihil sine ratione · nihil sine ritu',
  'Oleum sanctum · ferrum fidele',
  'Caro infirma · machina permanet',
  'Ordo ex numero · lux ex ordine',
  'Spiritus machinae, audi nos',
  'Fragmenta antiqua servamus',
  'Per ritum ad perfectionem'
];
const LITU = LIT.map(s => s.toUpperCase());
const PURGE = 'Exorcizamus te, codex immunde · redi in ordinem';
const PURGEU = ['EXORCIZAMUS TE', 'CODEX IMMUNDE', 'REDI IN ORDINEM', 'NUMERUS PURUS', 'SPIRITUS, AUDI'];
const CORR = [...'ЖЯЪЭѢѲѴҖҘΞΨΩλξζϞϠ∂∇∰∯≋⊗⊘⊛⋇ЮЩФ¥§‡'];
const garble = n => Array.from({ length: n }, () => Math.random() < .55 ? pick(CORR) : hex(1)).join('');

/* ---------- палитра ---------- */
const PH = {
  amber: { ph: '#ffab38', dim: '#b0601a', data: '#ffd08a', hot: '#fff3d6' },
  green: { ph: '#74ff84', dim: '#2c9446', data: '#c0ffb6', hot: '#f0fff0' }
};
let palKey = 'amber', pal = PH.amber;
const C = { brass: '#c48f40', brassHi: '#f2c977', brassDk: '#563611', bone: '#e6d4ac', her: '#c440ff', acid: '#b4ff2e',
  wax: '#9a1712', waxDk: '#420604', waxHi: '#d4382a', parch: '#d8c597' };

/* ---------- холсты ---------- */
const disp = document.getElementById('c'), dctx = disp.getContext('2d');
const scene = mk(1, 1), sctx = scene.getContext('2d');
const bloomC = mk(1, 1), bctx = bloomC.getContext('2d');
let W, H, DPR, R, CX, CY, k, amb, panels = null;
const imgs = {};

const mono = s => `${Math.round(s)}px VT323, "DejaVu Sans Mono", ui-monospace, monospace`;
const goth = s => `700 ${Math.round(s)}px UnifrakturCook, UnifrakturMaguntia, "Old English Text MT", serif`;

/* ---------- атлас знаков ---------- */
const gcache = new Map();
function G(ch, col, size) {
  size = Math.max(5, Math.round(size));
  const key = ch + col + size; let c = gcache.get(key);
  if (!c) {
    if (gcache.size > 5000) gcache.clear();
    const S = Math.ceil(size * 1.35); c = mk(S, S); const x = c.getContext('2d');
    x.font = mono(size); x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(ch, S / 2, S / 2); gcache.set(key, c);
  }
  return c;
}
function drawG(x, ch, col, size, px, py, alpha = 1, rot = 0, mir = false) {
  if (alpha <= 0.01) return;
  const g = G(ch, col, size); x.globalAlpha = alpha;
  if (!rot && !mir) x.drawImage(g, px - g.width / 2, py - g.height / 2);
  else { x.save(); x.translate(px, py); x.rotate(rot); if (mir) x.scale(-1, 1); x.drawImage(g, -g.width / 2, -g.height / 2); x.restore(); }
  x.globalAlpha = 1;
}

/* ---------- текст по окружности ---------- */
function drawCircText(x, r, str, font, color) {
  x.font = font; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
  const circ = TAU * r, unit = x.measureText(str).width || 1;
  const reps = Math.max(1, Math.round(circ / unit));
  const seq = [...str.repeat(reps)];
  const ws = seq.map(c => x.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0);
  const sc = circ / tot; let a = 0;
  for (let i = 0; i < seq.length; i++) {
    const w = ws[i] * sc, ang = a + w / 2 / r;
    if (seq[i] !== ' ') { x.save(); x.rotate(ang); x.translate(0, -r); x.fillText(seq[i], 0, 0); x.restore(); }
    a += w / r;
  }
}
function textRing(r, str, size, fontFn, color) {
  const S = 2 * (r + size) + 8, c = mk(S, S), x = c.getContext('2d');
  x.translate(S / 2, S / 2); drawCircText(x, r, str, fontFn(size), color); return c;
}

/* ---------- шестерни ---------- */
function gearPath(x, rp, n, th) {
  const p = TAU / n, r0 = rp - th / 2, r1 = rp + th / 2;
  x.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i * p;
    const pts = [[r0, a - p * .5], [r0, a - p * .28], [r1, a - p * .15], [r1, a + p * .15], [r0, a + p * .28]];
    for (let j = 0; j < 5; j++) { const [X, Y] = pol(pts[j][1], pts[j][0]); (i === 0 && j === 0) ? x.moveTo(X, Y) : x.lineTo(X, Y); }
  }
  x.closePath();
}
function brassGrad(x, rIn, rOut) {
  const g = x.createRadialGradient(0, 0, Math.max(0, rIn), 0, 0, rOut);
  g.addColorStop(0, C.brassDk); g.addColorStop(.5, C.brass); g.addColorStop(.82, C.brassHi); g.addColorStop(1, C.brass);
  return g;
}
function gearRing(rp, n, th, band, o = {}) {
  const S = 2 * (rp + th) + 8, c = mk(S, S), x = c.getContext('2d'); x.translate(S / 2, S / 2);
  const rin = rp - th / 2 - band;
  gearPath(x, rp, n, th); x.moveTo(rin, 0); x.arc(0, 0, rin, 0, TAU);
  x.fillStyle = brassGrad(x, rin, rp + th / 2); x.fill('evenodd');
  x.lineWidth = Math.max(1, 1.1 * k); x.strokeStyle = C.brassDk; x.stroke();
  x.beginPath(); x.arc(0, 0, rin + 1.6 * k, 0, TAU); x.strokeStyle = 'rgba(255,225,160,.35)'; x.lineWidth = Math.max(1, k); x.stroke();
  if (o.text) drawCircText(x, rin + band * .5, o.text, o.font, o.textColor || C.brassDk);
  if (o.spokes) {
    const hub = o.hub || rin * .3; x.lineCap = 'round';
    for (let i = 0; i < o.spokes; i++) {
      const a = i * TAU / o.spokes, [x0, y0] = pol(a, hub * .9), [x1, y1] = pol(a, rin + 1);
      x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.lineWidth = o.spokeW; x.strokeStyle = C.brass; x.stroke();
      x.lineWidth = Math.max(1, k * .8); x.strokeStyle = 'rgba(40,20,5,.7)'; x.stroke();
    }
    x.beginPath(); x.arc(0, 0, hub, 0, TAU); x.fillStyle = brassGrad(x, 0, hub); x.fill();
    x.lineWidth = Math.max(1, k); x.strokeStyle = C.brassDk; x.stroke();
    x.beginPath(); x.arc(0, 0, hub * .42, 0, TAU); x.fillStyle = '#000'; x.fill();
  }
  if (o.trefoil) {
    x.lineWidth = Math.max(1, 1.4 * k); x.strokeStyle = C.brass;
    for (let j = 0; j < 3; j++) { const [cx, cy] = pol(j * TAU / 3 + o.trefoilRot, rin * .4); x.beginPath(); x.arc(cx, cy, rin * .42, 0, TAU); x.stroke(); }
    x.beginPath(); x.arc(0, 0, rin * .16, 0, TAU); x.fillStyle = C.brass; x.fill();
    x.beginPath(); x.arc(0, 0, rin * .07, 0, TAU); x.fillStyle = '#000'; x.fill();
    drawCircText(x, rin * .88, o.inner, mono(o.innerSize), pal.dim);
  }
  return c;
}
function escWheel(r, n) {
  const S = 2 * r + 8, c = mk(S, S), x = c.getContext('2d'); x.translate(S / 2, S / 2);
  const p = TAU / n, r0 = r * .74; x.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i * p, pts = [[r0, a], [r, a + p * .55], [r * .93, a + p * .66], [r0, a + p * .72]];
    pts.forEach(([rr, g], j) => { const [X, Y] = pol(g, rr); (i === 0 && j === 0) ? x.moveTo(X, Y) : x.lineTo(X, Y); });
  }
  x.closePath(); x.moveTo(r * .56, 0); x.arc(0, 0, r * .56, 0, TAU);
  x.fillStyle = brassGrad(x, r * .5, r); x.fill('evenodd'); x.lineWidth = Math.max(1, k); x.strokeStyle = C.brassDk; x.stroke();
  x.lineCap = 'butt';
  for (let i = 0; i < 4; i++) { const a = i * TAU / 4 + TAU / 8, [X, Y] = pol(a, r * .58); x.beginPath(); x.moveTo(0, 0); x.lineTo(X, Y); x.lineWidth = r * .08; x.strokeStyle = C.brass; x.stroke(); }
  return c;
}

/* ---------- геометрия розы ---------- */
const BEAT = 1.6;
const RIM_N = 120, FOIL_N = 14, FOILS = 12;
let rimRp, rimTh, foilRc, foilR, foilTh, sats = [], foils = [], spokeAng = [];
const rings = [
  { key: 'A', r: .155, ang: () => ratchet(t, BEAT, 0, .38, true) * TAU / 48 },
  { key: 'B', r: .21, ang: () => -t * .035 },
  { key: 'C', r: .27, ang: () => flow(t, .06, .4) },
  { key: 'C2', r: .315, ang: () => t * .05 },
  { key: 'D', r: .615, ang: () => -ratchet(t, BEAT * 2, .5, .3, true) * TAU / 64 },
  { key: 'E', r: .67, ang: () => t * .018 },
  { key: 'F', r: .725, ang: () => -t * .03 }
];
const ringByKey = Object.fromEntries(rings.map(r => [r.key, r]));

function ratchet(t, period, phase, d = .2, soft = false) {
  const u = t / period + phase, n = Math.floor(u), f = u - n;
  if (f < 1 - d) return n;
  const q = (f - (1 - d)) / d;
  return n + (soft ? softOut(q) : backOut(q));
}
const softOut = x => { const c1 = .45, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
// непрерывный ход, дышащий в такт: скорость ω·(1 + a·cos 2πt/T), не останавливается при a < 1
const flow = (t, w, a = .55) => w * (t + a * BEAT / TAU * Math.sin(TAU * t / BEAT));
const rimAng = () => -flow(t, .045);

function makeImgs() {
  imgs.A = textRing(.155 * R, toBin(LIT[4]) + '   ', 14 * k, mono, pal.ph);
  imgs.B = textRing(.21 * R, LIT[1] + ' · ' + LIT[6] + ' · ', 19 * k, goth, C.bone);
  imgs.C = textRing(.27 * R, randBin(70), 13 * k, mono, pal.dim);
  imgs.C2 = textRing(.315 * R, randHex(40), 11 * k, mono, pal.data);
  imgs.D = textRing(.615 * R, toBin(LIT[5]) + '   ', 14 * k, mono, pal.ph);
  imgs.E = textRing(.67 * R, LIT[0] + ' · ' + LIT[2] + ' · ', 21 * k, goth, C.bone);
  imgs.Epurge = textRing(.67 * R, PURGE + ' · ', 21 * k, goth, pal.hot);
  imgs.F = textRing(.725 * R, randBin(130), 11 * k, mono, pal.dim);
  imgs.rim = gearRing(rimRp, RIM_N, rimTh, .035 * R, { text: randHex(90), font: mono(11 * k), textColor: 'rgba(50,28,6,.9)' });
  imgs.foil = [0, 1].map(v => gearRing(foilR, FOIL_N, foilTh, .018 * R,
    { trefoil: true, trefoilRot: v * Math.PI / 3, inner: randBin(9), innerSize: 8.5 * k }));
  imgs.esc = escWheel(.105 * R, 15);
  sats.forEach(s => {
    s.img = gearRing(s.rp, s.n, rimTh, .028 * R, { spokes: s.n > 20 ? 5 : 4, spokeW: .02 * R, hub: s.rp * .26,
      text: randBin(s.n > 20 ? 12 : 5), font: mono(9 * k), textColor: 'rgba(50,28,6,.9)' });
  });
}

function build() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  disp.width = scene.width = W; disp.height = scene.height = H;
  bloomC.width = Math.ceil(W / 4); bloomC.height = Math.ceil(H / 4);
  R = Math.min(W * .44, H * .42); CX = W / 2; CY = H / 2; k = R / 400;
  rimRp = .85 * R; rimTh = .035 * R;
  foilRc = .46 * R; foilR = foilRc * Math.sin(Math.PI / FOILS); foilTh = .028 * R;
  // спутники, сцеплённые с ободом
  sats = [[TAU / 4, 28], [-TAU / 4, 28], [TAU / 4 - .7, 12], [TAU / 4 + .7, 12], [-TAU / 4 - .7, 12], [-TAU / 4 + .7, 12]]
    .map(([phi, n]) => { const rp = rimRp * n / RIM_N, d = rimRp + rp; return { phi, n, rp, x: Math.sin(phi) * d, y: -Math.cos(phi) * d }; });
  // венец лепестков-шестерён: фазы для зацепления
  foils = []; let psi = 0;
  for (let i = 0; i < FOILS; i++) {
    const a = i * TAU / FOILS, [x, y] = pol(a, foilRc);
    foils.push({ x, y, psi, s: i % 2 ? -1 : 1, v: i % 2 });
    const [nx, ny] = pol((i + 1) * TAU / FOILS, foilRc), beta = dirAng(nx - x, ny - y);
    psi = -psi + 2 * beta + Math.PI + Math.PI / FOIL_N;
  }
  spokeAng = Array.from({ length: FOILS }, (_, i) => i * TAU / FOILS + TAU / FOILS / 2);
  // боковые панели
  const pw = CX - 1.3 * R - .055 * W;
  panels = pw > 150 * DPR ? { L: { x: .035 * W, y: .07 * H, w: pw, h: .86 * H }, R: { x: CX + 1.3 * R + .02 * W, y: .07 * H, w: pw, h: .86 * H } } : null;
  gcache.clear(); makeImgs(); makeAmbient(); initParticles(); schem = null;
  sctx.globalCompositeOperation = 'source-over'; sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, H);
  patches.forEach(q => q.img = makePatch(q.code));
}

function makeAmbient() {
  amb = mk(W, H); const x = amb.getContext('2d');
  x.fillStyle = '#060201'; x.fillRect(0, 0, W, H);
  let g = x.createRadialGradient(CX, CY, 0, CX, CY, 1.55 * R);
  g.addColorStop(0, 'rgba(125,42,14,.30)'); g.addColorStop(.55, 'rgba(85,24,8,.15)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createLinearGradient(0, H, 0, H * .55); g.addColorStop(0, 'rgba(120,44,10,.20)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 1600; i++) {
    x.fillStyle = `rgba(${200 + rnd(50) | 0},${130 + rnd(50) | 0},80,${rnd(.015, .06)})`;
    const s = rnd(.8, 2.2) * DPR; x.fillRect(rnd(W), rnd(H), s, s);
  }
  x.lineWidth = DPR;
  for (let i = 0; i < 16; i++) {
    x.strokeStyle = `rgba(210,180,130,${rnd(.015, .04)})`;
    const x0 = rnd(W), y0 = rnd(H), a = rnd(TAU), L = rnd(.05, .3) * H;
    x.beginPath(); x.moveTo(x0, y0); x.quadraticCurveTo(x0 + Math.cos(a + .3) * L / 2, y0 + Math.sin(a + .3) * L / 2, x0 + Math.cos(a) * L, y0 + Math.sin(a) * L); x.stroke();
  }
}

/* ---------- кадильный дым данных ---------- */
let parts = [], srcs = [];
function initParticles() {
  srcs = [.07, .2, .33, .5, .67, .8, .93].map(f => f * W);
  const N = Math.min(650, Math.round(W / DPR / 3.2));
  parts = []; for (let i = 0; i < N; i++) parts.push(spawn(true));
}
function spawn(init) {
  return { x0: pick(srcs) + rnd(-25, 25) * k, y: init ? rnd(H) : H + rnd(10, 60) * k, v: rnd(16, 40) * k, ph: rnd(TAU), f: rnd(.6, 1.4),
    ch: Math.random() < .5 ? '0' : '1', s: rnd(.7, 1.15), sw: rnd(10, 36) * k, drift: rnd(-1, 1), x: 0 };
}
function updParticles(dt) {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i]; p.y -= p.v * dt * (1 + beatPulse * .25);
    const h = (H - p.y) / H;
    p.x = p.x0 + Math.sin(p.y * .004 / k * p.f + t * .55 + p.ph) * p.sw * (.3 + h * 1.7) + h * h * 90 * k * p.drift;
    if (Math.random() < dt * .4) p.ch = p.ch === '0' ? '1' : '0';
    if (p.y < -30 * k) parts[i] = spawn(false);
  }
}
function drawParticles(x) {
  for (const p of parts) {
    const h = clamp((H - p.y) / H);
    const a = Math.sin(Math.PI * clamp(h * 1.12)) * .5;
    drawG(x, p.ch, h > .55 ? pal.dim : pal.data, 13 * k * p.s, p.x, p.y, a);
  }
}

/* ---------- импульсы по спицам и вспышки ---------- */
let pulses = [], flashes = [];
function launch(i, col, fast) {
  pulses.push({ sp: i, r: .12 * R, v: (fast ? rnd(.9, 1.1) : rnd(.45, .7)) * R, col: col || pal.data, chars: bin8(), crossed: false });
}
function updPulses(dt) {
  const meshR = foilRc * Math.cos(Math.PI / FOILS);
  for (const p of pulses) {
    const r0 = p.r; p.r += p.v * dt;
    if (r0 < meshR && p.r >= meshR) { const [X, Y] = pol(spokeAng[p.sp], meshR); flashes.push({ x: X, y: Y, life: .45, max: .45, size: 22 * k, col: p.col }); }
    if (r0 < .79 * R && p.r >= .79 * R) { const [X, Y] = pol(spokeAng[p.sp], .79 * R); flashes.push({ x: X, y: Y, life: .35, max: .35, size: 16 * k, col: p.col }); }
  }
  pulses = pulses.filter(p => p.r < .82 * R);
  for (const f of flashes) f.life -= dt;
  flashes = flashes.filter(f => f.life > 0);
}
function drawPulses(x) {
  x.save(); x.translate(CX, CY);
  for (const p of pulses) {
    const a = spokeAng[p.sp];
    for (let j = 0; j < 8; j++) {
      const rr = p.r - j * 13 * k; if (rr < .12 * R || rr > .8 * R) continue;
      const [X, Y] = pol(a, rr); drawG(x, p.chars[j], p.col, 13 * k, X, Y, 1 - j / 8, a);
    }
  }
  x.globalCompositeOperation = 'lighter';
  for (const f of flashes) {
    const q = f.life / f.max, g = x.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
    g.addColorStop(0, f.col); g.addColorStop(1, 'rgba(0,0,0,0)');

  if (hz.amp < 1e-4) return 0;
  return rr > hz.rMin - .06 * R ? hz.amp * (Math.sin(t * 17 + i * 3.1) * .6 + Math.sin(t * 41 + i * 1.7) * .4) : 0;
}
function drawRot(x, img, ang, ox = 0, oy = 0, alpha = 1) {
  x.save(); x.globalAlpha = alpha; x.translate(ox, oy); x.rotate(ang); x.drawImage(img, -img.width / 2, -img.height / 2); x.restore();
}
function drawScars(x, key, ang, r) {
  for (const s of scars) {
    if (s.key !== key) continue;
    const life = clamp(1 - (t - s.born) / 150); if (life <= 0) continue;
    const a = s.aRel + ang - Math.PI / 2;
    x.globalAlpha = .85 * life; x.strokeStyle = '#000'; x.lineWidth = 24 * k;
    x.beginPath(); x.arc(0, 0, r, a, a + s.len); x.stroke();
    x.globalAlpha = .5 * life; x.strokeStyle = '#7a1d10'; x.lineWidth = Math.max(1, k);
    x.beginPath(); x.arc(0, 0, r - 12 * k, a, a + s.len); x.stroke(); x.beginPath(); x.arc(0, 0, r + 12 * k, a, a + s.len); x.stroke();
    x.globalAlpha = 1;
  }
}
function drawRose(x) {
  x.save(); x.translate(CX, CY);
  // тёмный диск за розой
  let g = x.createRadialGradient(0, 0, 0, 0, 0, 1.02 * R);
  g.addColorStop(0, 'rgba(0,0,0,.9)'); g.addColorStop(.8, 'rgba(0,0,0,.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, 1.02 * R, 0, TAU); x.fill();
  // ореол ноосферы
  x.setLineDash([2 * k, 9 * k]); x.lineDashOffset = -t * 20 * k; x.strokeStyle = pal.dim; x.globalAlpha = .5; x.lineWidth = 1.5 * k;
  x.beginPath(); x.arc(0, 0, .93 * R, 0, TAU); x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
  // спицы и опорные круги
  x.strokeStyle = C.brassDk; x.lineWidth = 1.6 * k; x.globalAlpha = .8;
  for (const a of spokeAng) { const [x0, y0] = pol(a, .12 * R), [x1, y1] = pol(a, .795 * R); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); }
  x.strokeStyle = C.brass; x.globalAlpha = .55; x.lineWidth = 1.2 * k;
  for (const rr of [.125, .24, .295, .335, .585, .7, .78]) { x.beginPath(); x.arc(0, 0, rr * R, 0, TAU); x.stroke(); }
  x.globalAlpha = 1;
  // кольца
  rings.forEach((rg, i) => {
    const ang = rg.ang() + jit(i, rg.r * R);
    if (rg.key === 'E' && hz.purgeGlow > 0) { drawRot(x, imgs.E, ang, 0, 0, 1 - hz.purgeGlow); drawRot(x, imgs.Epurge, ang, 0, 0, hz.purgeGlow); }
    else drawRot(x, imgs[rg.key], ang);
    drawScars(x, rg.key, rg.ang(), rg.r * R);
  });
  // венец шестерён-лепестков
  const tf = flow(t, .32);
  foils.forEach((f, i) => drawRot(x, imgs.foil[f.v], f.s * tf + f.psi + jit(i + 20, foilRc), f.x, f.y));
  // обод и спутники
  const trim = rimAng();
  drawRot(x, imgs.rim, trim + jit(40, rimRp));
  if (hz.phase === 'purge') {   // накал растёт за отступающей скверной
    const s3 = hz.p * hz.p * (3 - 2 * hz.p);
    drawHeat(x, hz.phi, Math.min(.86 * R, hz.rMin), s3);
  }
  for (const q of patches) {
    const aAbs = trim + q.aRel + jit(40, rimRp), age = t - q.born;
    if (age < 14) drawHeat(x, aAbs, .86 * R, Math.pow(1 - age / 14, 1.4));   // остывание
    x.save(); x.rotate(aAbs); x.globalAlpha = clamp(age / 1.2); x.drawImage(q.img.c, -q.img.w / 2, -q.img.r1 - 4);
    if (age < 18) { x.globalCompositeOperation = 'lighter'; x.globalAlpha = Math.pow(1 - age / 18, 2) * .9; x.drawImage(q.img.c, -q.img.w / 2, -q.img.r1 - 4); }
    x.restore();
  }
  sats.forEach((s, i) => drawRot(x, s.img, -(RIM_N / s.n) * (trim - s.phi) + s.phi + Math.PI + Math.PI / s.n + jit(50 + i, rimRp) * 2.5, s.x, s.y));
  // сердце: спуск и линза
  const te = flow(t, .22, .7);
  drawRot(x, imgs.esc, te + jit(60, .1 * R));
  x.beginPath(); x.arc(0, 0, .058 * R, 0, TAU); x.fillStyle = '#000'; x.fill();
  x.lineWidth = 1.2 * k; x.strokeStyle = C.brass; x.stroke();
  const her = hz.int > .2 && Math.random() < hz.int * .6;
  const lensCol = her ? C.her : pal.ph, lr = .046 * R * (1 + .08 * beatPulse);
  g = x.createRadialGradient(0, 0, 0, 0, 0, lr);
  g.addColorStop(0, hz.purgeGlow > .1 ? '#ffffff' : pal.hot); g.addColorStop(.35, lensCol); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.globalAlpha = .55 + .45 * beatPulse + .4 * hz.purgeGlow; x.fillStyle = g; x.beginPath(); x.arc(0, 0, lr, 0, TAU); x.fill();
  x.globalAlpha = .6; x.strokeStyle = pal.dim; x.lineWidth = k;
  for (const rr of [.02, .032]) { x.beginPath(); x.arc(0, 0, rr * R, 0, TAU); x.stroke(); }
  x.globalAlpha = 1;
  x.restore();
}

/* ---------- такт ---------- */
function onBeat(n) {
  beatPulse = 1; orationes++;
  const cnt = hz.phase === 'in' ? (Math.random() < .5 ? 1 : 0) : 1 + (Math.random() * 2.2 | 0);
  for (let i = 0; i < cnt; i++) launch(Math.random() * FOILS | 0);
  if (n % 4 === 0) imgs.C = textRing(.27 * R, randBin(70), 13 * k, mono, pal.dim);
  if (n % 6 === 3) imgs.F = textRing(.725 * R, randBin(130), 11 * k, mono, pal.dim);
  if (hz.phase !== 'in') sats.forEach(s => { const [X, Y] = pol(s.phi, rimRp); flashes.push({ x: X, y: Y, life: .3, max: .3, size: 14 * k, col: pal.ph }); });
}

/* ---------- кадр ---------- */
let t = 0, last = performance.now(), lastBeat = -1, paused = false;
function update(dt) {
  const b = Math.floor(t / BEAT); if (b !== lastBeat) { lastBeat = b; onBeat(b); }
  beatPulse *= Math.exp(-dt * 4);
  updHeresy(dt); updParticles(dt); updPulses(dt);
  logTimer -= dt; if (logTimer <= 0) { genLog(); logTimer = hz.phase === 'idle' ? rnd(.25, .8) : hz.phase === 'purge' ? rnd(.55, .7) : rnd(.12, .3); }
  motiva = clamp(motiva + rnd(-.004, .004) + (.87 - motiva) * .01, .7, 1);
  calor = clamp(calor + rnd(-.05, .05) + hz.int * .2 * dt * 10 - (calor - 61) * .002, 40, 140);
  ung = clamp(ung - dt * .02 + (Math.random() < .002 ? 20 : 0), 30, 99);
}
function render() {
  // послесвечение люминофора
  sctx.globalCompositeOperation = 'source-over';
  sctx.fillStyle = 'rgba(0,0,0,.32)'; sctx.fillRect(0, 0, W, H);
  drawParticles(sctx);
  if (panels) { sctx.fillStyle = 'rgba(0,0,0,.6)'; for (const P of [panels.L, panels.R]) sctx.fillRect(P.x - 4 * DPR, P.y - 30 * DPR, P.w + 8 * DPR, P.h + 34 * DPR);
    drawLog(sctx); drawSchem(sctx); drawStatus(sctx, panels.R.y + Math.min(panels.R.w, H * .38) + fsP() * 3.4); }
  drawRose(sctx); drawPulses(sctx); drawHeresy(sctx); drawPurge(sctx);
  // сведение
  dctx.globalCompositeOperation = 'source-over'; dctx.globalAlpha = 1; dctx.drawImage(amb, 0, 0);
  dctx.globalCompositeOperation = 'lighter'; dctx.drawImage(scene, 0, 0);
  bctx.clearRect(0, 0, bloomC.width, bloomC.height); bctx.filter = `blur(${Math.max(2, 3 * DPR)}px)`;
  bctx.drawImage(scene, 0, 0, bloomC.width, bloomC.height); bctx.filter = 'none';
  dctx.globalAlpha = .6 + .25 * hz.purgeGlow; dctx.drawImage(bloomC, 0, 0, W, H); dctx.globalAlpha = 1;
  // бегущая полоса развёртки
  const by = ((t * .07) % 1.3 - .15) * H, bg = dctx.createLinearGradient(0, by - .07 * H, 0, by + .07 * H);
  bg.addColorStop(0, 'rgba(255,200,140,0)'); bg.addColorStop(.5, 'rgba(255,200,140,.035)'); bg.addColorStop(1, 'rgba(255,200,140,0)');
  dctx.fillStyle = bg; dctx.fillRect(0, by - .07 * H, W, .14 * H);
  if (hz.int > .02) { dctx.fillStyle = `rgba(150,30,220,${.07 * hz.int})`; dctx.fillRect(0, 0, W, H); }
  dctx.globalCompositeOperation = 'source-over';
  // сбой развёртки при ереси
  if (hz.phase === 'in' && Math.random() < .25 * hz.int) {
    for (let i = 0, n = 2 + (Math.random() * 4 | 0); i < n; i++) {
      const y = rnd(H), h = rnd(4, 34) * DPR, dx = rnd(-50, 50) * DPR * hz.int;
      dctx.drawImage(disp, 0, y, W, h, dx, y, W, h);
    }
  }
  dctx.fillStyle = `rgba(0,0,0,${rnd(0, .045)})`; dctx.fillRect(0, 0, W, H);
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (paused) return;
  dt = Math.min(dt, .05); t += dt; update(dt); render();
}

/* ---------- управление ---------- */
const ui = document.getElementById('ui'); let uiTimer = 0;
function showUI() { ui.classList.add('show'); clearTimeout(uiTimer); uiTimer = setTimeout(() => ui.classList.remove('show'), 2800); }
addEventListener('mousemove', showUI); addEventListener('touchstart', showUI, { passive: true });
function act(a) {
  if (a === 'heresy') { if (hz.phase === 'idle') { hz.next = t; startHeresy(); } }
  else if (a === 'pal') { palKey = palKey === 'amber' ? 'green' : 'amber'; pal = PH[palKey]; gcache.clear(); makeImgs(); }
  else if (a === 'pause') { paused = !paused; }
  else if (a === 'fs') { const d = document; (d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen?.())?.catch?.(() => {}); }
}
ui.addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });
addEventListener('keydown', e => { const m = { h: 'heresy', g: 'pal', p: 'pause', f: 'fs' }[e.key.toLowerCase()] || ({ 'р': 'heresy', 'п': 'pal', 'з': 'pause', 'а': 'fs' })[e.key.toLowerCase()]; if (m) act(m); });
let rzT = 0; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(build, 150); });

/* ---------- запуск ---------- */
const fontsReady = Promise.race([
  Promise.all([document.fonts.load('700 20px UnifrakturCook'), document.fonts.load('20px VT323')]).catch(() => {}),
  new Promise(r => setTimeout(r, 2500))
]);
fontsReady.then(() => {
  build();
  for (let i = 0; i < 6; i++) genLog();
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
});
</script>
</body>
